  function renderTopic(i){
    const t = TOPICS[+i] || TOPICS[0];
    parkLead();
    const v = $("#viewer");
    v.dataset.view = "detail";
    v.dataset.topic = t.key;            // 阴刻·阳刻那一页要按这个把整页钉死、不许滚
    v.scrollTop = 0;
    root.innerHTML =
      '<button class="arch-back" id="topicBack">‹ 返回 认识版画</button>' +
      '<div class="sub-head"><span class="sub-no">' + t.no + '</span><h2>' + t.name + '</h2>' +
        '<span class="en">' + t.en + '</span></div>' +
      '<p class="sub-lead">' + t.lede + '</p>' +
      t.page + (t.src || SRC);
    requestAnimationFrame(fitViewer);   // 换页后重新量一遍：装得下才钉一屏
    $("#topicBack", root).addEventListener("click", renderMain);
    const gallery = $("#gallery", root);
    if(gallery){
      const modal = $("#yyModal", root), count = $("#yyCount", root), kind = $("#yyKind", root),
            tabs = $$(".yy-tab", root);
      const label = key => (key === "yang" ? "阳刻" : "阴刻");
      const closeModal = () => {
        modal.classList.remove("on");
        gallery.innerHTML = "";
        tabs.forEach(b => b.setAttribute("aria-pressed", "false"));
      };
      const show = key => {
        const list = CASES[key];
        tabs.forEach(b => {
          const on = b.dataset.k === key;
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        kind.textContent = label(key) + " · " + (key === "yang" ? "白底黑线" : "黑底白线");
        gallery.innerHTML = list.map(caseCard).join("");
        /* 开卡的那一下鼠标事件会落在刚出现的卡面上，先挡 400ms 免得一进来就翻页 */
        gallery.style.pointerEvents = "none";
        setTimeout(() => { gallery.style.pointerEvents = ""; }, 400);
        initStack(gallery, {
          layout:"fan", spread:.42, depth:.5,
          onChange: idx => { count.textContent = (idx + 1) + " / " + list.length + " · " + list[idx].t; }
        });
        count.textContent = "1 / " + list.length + " · " + list[0].t;
        modal.classList.add("on");
        $("#yyX", root).focus();
      };
      tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.k)));
      $("#yyX", root).addEventListener("click", closeModal);
      modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
      root.addEventListener("keydown", e => {
        if(e.key === "Escape" && modal.classList.contains("on")){ e.stopPropagation(); closeModal(); }
      });
    }
    /* 02.1 门类：点一块印版，翻开一本书；封面转开才看见正文 */
    const prGrid = $("#prGrid", root);
    if(prGrid){
      const modal = $("#prModal", root), book = $("#prBook", root),
            body = $("#prBody", root), cap = $("#prCap", root),
            cimg = $("#prCoverImg", root);
      const closeBook = () => {
        modal.classList.remove("on");
        book.classList.remove("open");
      };
      const openBook = k => {
        const p = PRINTS.find(x => x.k === k) || PRINTS[0];
        body.innerHTML = '<h4>' + p.h + '</h4>' + p.body + '<em>' + p.em + '</em>';
        cimg.src = PLATE + p.work; cimg.alt = p.workAlt;
        cap.textContent = p.cap;
        body.scrollTop = 0;
        book.classList.remove("open");
        book.classList.add("no-hover");       // 摘掉它之前，悬停不许把封面翻走
        modal.classList.add("on");
        $("#prX", root).focus();
      };
      modal.addEventListener("pointermove", () => book.classList.remove("no-hover"));
      $$(".pr-card", root).forEach(c => c.addEventListener("click", () => openBook(c.dataset.k)));
      $("#prX", root).addEventListener("click", closeBook);
      modal.addEventListener("click", e => { if(e.target === modal) closeBook(); });

      /* Esc 关书不关展项：挂在 document 的捕获段，遮罩里焦点在哪都拦得住；
         换页之后这个监听会自己摘掉 */
      const onKey = e => {
        if(!modal.isConnected){ document.removeEventListener("keydown", onKey, true); return; }
        if(e.key === "Escape" && modal.classList.contains("on")){
          e.stopPropagation(); closeBook();
        }
      };
      document.addEventListener("keydown", onKey, true);
    }
    /* 02.2 工序：点一张照片，弹出一张"讲究"卡 */
    const stGrid = $("#stGrid", root);
    if(stGrid){
      const modal = $("#stModal", root), no = $("#stNo", root),
            ttl = $("#stT", root), para = $("#stP", root);
      const closeCard = () => modal.classList.remove("on");
      const openCard = i => {
        const d = STEP_DATA[i];
        no.textContent = "第 " + d.no + " 道 · " + d.note;
        ttl.textContent = d.n;
        para.innerHTML = d.body.map(t => "<p>" + t + "</p>").join("");
        modal.classList.add("on");
        $("#stX", root).focus();
      };
      $$(".st-card", root).forEach(c => c.addEventListener("click", () => openCard(+c.dataset.i)));
      $("#stX", root).addEventListener("click", closeCard);
      $("#stB", root).addEventListener("click", closeCard);
      modal.addEventListener("click", e => { if(e.target === modal) closeCard(); });
      const onKey = e => {
        if(!modal.isConnected){ document.removeEventListener("keydown", onKey, true); return; }
        if(e.key === "Escape" && modal.classList.contains("on")){ e.stopPropagation(); closeCard(); }
      };
      document.addEventListener("keydown", onKey, true);
    }
    /* 02.3 刀法：点开一把刀，在板上试刻——刀痕按刃口形状走，旁边同步给印样 */
    const kfGrid = $("#kfGrid", root);
    if(kfGrid){
      const modal = $("#kfModal", root), title = $("#kfTitle", root), sub = $("#kfSub", root),
            why = $("#kfWhy", root), board = $("#kfBoard", root), printCv = $("#kfPrint", root),
            cursor = $("#kfCursor", root);
      const bctx = board.getContext("2d"), pctx = printCv.getContext("2d");
      const wood = document.createElement("canvas"), ink = document.createElement("canvas"),
            shade = document.createElement("canvas");
      const wctx = wood.getContext("2d"), ictx = ink.getContext("2d"), sctx = shade.getContext("2d");
      let tool = 0, strokes = [], cur = null, dpr = 1, cssW = 0, cssH = 0, grain = [];

      /* 槽里的暗影按刀型走：三角刀窄而深、圆刀宽而软、平刀整片平 */
      const shadeW = d => d.w * (d.k === "tri" ? .34 : d.k === "round" ? .58 : .82);

      function paint(ctx, scale, mode){
        ctx.lineJoin = ctx.lineCap = "round";
        strokes.forEach(s => {
          const d = KNIFE_DATA[s.t];
          ctx.lineWidth = (mode === "shade" ? shadeW(d) : d.w) * scale;
          ctx.filter = mode === "shade" ? (d.k === "round" ? "blur(3px)" : "blur(.6px)") : "none";
          ctx.strokeStyle = mode === "shade"
            ? (d.k === "tri" ? "rgba(46,32,20,.5)" : d.k === "round" ? "rgba(46,32,20,.34)" : "rgba(46,32,20,.2)")
            : (mode === "print" ? "#EDE8DE" : "#ffffff");
          ctx.beginPath();
          const p0 = s.pts[0];
          ctx.moveTo(p0[0] * scale, p0[1] * scale);
          if(s.pts.length === 1) ctx.lineTo(p0[0] * scale + .01, p0[1] * scale + .01);
          for(let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0] * scale, s.pts[i][1] * scale);
          ctx.stroke();
        });
        ctx.filter = "none";
      }

      function size(){
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const r = board.getBoundingClientRect();
        cssW = Math.max(320, Math.round(r.width));
        cssH = Math.round(cssW * 5 / 7);
        [board, wood, ink, shade].forEach(c => {
          c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
        });
        const pr = printCv.getBoundingClientRect();
        printCv.width = Math.max(160, Math.round((pr.width || 240) * dpr));
        printCv.height = Math.round(printCv.width * 5 / 7);
      }

      function makeGrain(){
        grain = [];
        for(let i = 0; i < 26; i++) grain.push({
          y: Math.random() * cssH, w: .6 + Math.random() * 2.4, amp: 2 + Math.random() * 9,
          lam: 60 + Math.random() * 150, ph: Math.random() * 400, hot: Math.random() > .55
        });
      }
      function drawWood(){
        wctx.setTransform(1, 0, 0, 1, 0, 0);
        wctx.fillStyle = "#C9A479";
        wctx.fillRect(0, 0, wood.width, wood.height);
        grainLines(wctx, 1);
      }
      function grainLines(ctx, alpha){
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.globalAlpha = alpha;
        grain.forEach(g => {
          ctx.strokeStyle = g.hot ? "rgba(122,88,54,.3)" : "rgba(236,218,188,.32)";
          ctx.lineWidth = g.w;
          ctx.beginPath();
          for(let x = -30; x <= cssW + 30; x += 20){
            const y = g.y + Math.sin((x + g.ph) / g.lam) * g.amp;
            if(x === -30) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
        ctx.restore();
      }

      function render(){
        bctx.setTransform(1, 0, 0, 1, 0, 0);
        bctx.clearRect(0, 0, board.width, board.height);
        bctx.drawImage(wood, 0, 0);
        /* 版面盖一层墨：刻到哪儿墨就少一块，露出下面的木头 */
        ictx.setTransform(1, 0, 0, 1, 0, 0);
        ictx.globalCompositeOperation = "source-over";
        ictx.clearRect(0, 0, ink.width, ink.height);
        ictx.fillStyle = "rgba(19,15,13,.9)";
        ictx.fillRect(0, 0, ink.width, ink.height);
        ictx.globalCompositeOperation = "destination-out";
        paint(ictx, dpr, "reveal");
        ictx.globalCompositeOperation = "source-over";
        bctx.drawImage(ink, 0, 0);
        grainLines(bctx, .22);          // 墨面下也能透出一点木纹
        sctx.setTransform(1, 0, 0, 1, 0, 0);
        sctx.clearRect(0, 0, shade.width, shade.height);
        paint(sctx, dpr, "shade");
        bctx.drawImage(shade, 0, 0);
        /* 印样：没刻到的地方沾墨印黑，刻掉的槽留纸色 */
        pctx.setTransform(1, 0, 0, 1, 0, 0);
        pctx.fillStyle = "#151110";
        pctx.fillRect(0, 0, printCv.width, printCv.height);
        paint(pctx, printCv.width / cssW, "print");
      }

      const pos = e => {
        const r = board.getBoundingClientRect();
        return [(e.clientX - r.left) * cssW / r.width, (e.clientY - r.top) * cssH / r.height];
      };
      board.addEventListener("pointerdown", e => {
        board.setPointerCapture(e.pointerId);
        cur = { t: tool, pts: [pos(e)] };
        strokes.push(cur);
        render();
      });
      board.addEventListener("pointermove", e => {
        const r = board.getBoundingClientRect();
        cursor.style.left = (e.clientX - r.left) + "px";
        cursor.style.top = (e.clientY - r.top) + "px";
        if(!cur) return;
        const p = pos(e), last = cur.pts[cur.pts.length - 1];
        if(Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.2) return;
        cur.pts.push(p);
        render();
      });
      const endStroke = () => { cur = null; };
      board.addEventListener("pointerup", endStroke);
      board.addEventListener("pointercancel", endStroke);

      const openKf = i => {
        tool = i;
        const d = KNIFE_DATA[i];
        title.textContent = d.n;
        sub.textContent = d.en;
        why.innerHTML = d.body.map(t => "<p>" + t + "</p>").join("");
        cursor.style.width = cursor.style.height = d.w + "px";
        cursor.style.left = cursor.style.top = "-99px";
        strokes = []; cur = null;
        modal.classList.add("on");
        requestAnimationFrame(() => { size(); makeGrain(); drawWood(); render(); });
        $("#kfX", root).focus();
      };
      const closeKf = () => { modal.classList.remove("on"); cur = null; };
      $$(".kf-card", root).forEach(c => c.addEventListener("click", () => openKf(+c.dataset.i)));
      $("#kfX", root).addEventListener("click", closeKf);
      $("#kfClear", root).addEventListener("click", () => { strokes = []; render(); });
      modal.addEventListener("click", e => { if(e.target === modal) closeKf(); });
      const onKey = e => {
        if(!modal.isConnected){ document.removeEventListener("keydown", onKey, true); return; }
        if(e.key === "Escape" && modal.classList.contains("on")){ e.stopPropagation(); closeKf(); }
      };
      document.addEventListener("keydown", onKey, true);
      const onResize = () => {
        if(!modal.isConnected){ removeEventListener("resize", onResize); return; }
        if(modal.classList.contains("on")){ size(); makeGrain(); drawWood(); render(); }
      };
      addEventListener("resize", onResize);
    }
  }
}

  function mergeStrokes(list){

    const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
    const dir = (a, b) => Math.atan2(b[1]-a[1], b[0]-a[0]);
    const angDiff = (u, v) => { let d = Math.abs(u - v) % (Math.PI*2); return d > Math.PI ? Math.PI*2 - d : d; };
    const len = pts => pts.reduce((n, p, i) => i ? n + dist(pts[i-1], p) : 0, 0);
    function tangent(seq, atEnd){
      if (seq.length < 2) return null;

      let j = atEnd ? seq.length-2 : 1;
      while ((atEnd ? j > 0 : j < seq.length-1) && dist(seq[j], p) < 5) j += atEnd ? -1 : 1;
      return atEnd ? dir(seq[j], p) : dir(p, seq[j]);

      const first = reverseA ? a.slice().reverse() : a;
      const second = reverseB ? b.slice().reverse() : b;
      if (first.length < 2 || second.length < 2) return null;
      const pa = first[first.length-1], pb = second[0];
      const gap = dist(pa, pb);
      const inDir = tangent(first, true), outDir = tangent(second, false);
      const gapDir = gap > .5 ? dir(pa, pb) : inDir;

      const cont = angDiff(inDir, outDir);
      const near = gap <= 7;
      const maxGap = near ? 40 : (bend < .65 ? 50 : bend < 1.1 ? 38 : 26);
      if (gap > maxGap || cont > (near ? 3.2 : 2.4) || bend > (near ? 2.6 : 1.9)) return null;
      return { seq: first.concat(second), score: gap + bend * 18 + cont * 8 };
    }
    const rounds = P.length > 300 ? 8 : P.length > 120 ? 14 : 100;
    for (let round = 0; round < rounds; round++) {
      const bests = [];
      for (let i = 0; i < P.length; i++) {
        let best = null;
        for (let j = 0; j < P.length; j++) {
          if (i === j) continue;
          for (const reverseA of [false, true]) for (const reverseB of [false, true]) {
            const c = candidate(P[i].pts, P[j].pts, reverseA, reverseB);
            if (c && (!best || c.score < best.score)) best = { i, j, seq: c.seq, score: c.score };

      if (!picked.length) break;

        const c = byI.get(i);

    let strokes, mask = null;
    if (t.kind === "vec") {
      strokes = t.strokes.map(s => ({ pts: s.pts.map(p => [p[0]*MW, p[1]*MH]), tool: s.tool, w: s.w }));
    } else {
      const res = traceRaster(await loadImg(t.src));
      strokes = res.strokes;
      mask = res.mask;
      /* 先描长线：提示从主体轮廓开始，不会一上来就指到碎线头 */
      const len = s => s.pts.reduce((a, p, i) => i ? a + Math.hypot(p[0]-s.pts[i-1][0], p[1]-s.pts[i-1][1]) : a, 0);
      strokes = mergeStrokes(strokes);
      strokes.sort((a, b) => len(b) - len(a));
    }
    if (!mask) {
      mask = document.createElement("canvas"); mask.width = MW; mask.height = MH;
      const g = mask.getContext("2d");
      g.strokeStyle = "#fff"; g.lineCap = g.lineJoin = "round";
      strokes.forEach(s => {
        g.lineWidth = Math.max(4, s.w);
        g.beginPath();
        s.pts.forEach((p,i) => i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]));
        g.stroke();
      });
    }
    t.strokes2 = strokes;
    t.mask = mask;
    t.guide = tint(mask, "#2A170B");       // 参考线：深色才看得见
    t.ink = tint(mask, "#201810");       // 缩略图用：深色线条才看得出
    t.ready = true;
    return t;
  }

  function makeGrid(){ st.grid = new Uint8Array(GW*GH); }
  function markGrid(x, y, r){
    const gx0 = Math.max(0, ((x-r)/6)|0), gx1 = Math.min(GW-1, ((x+r)/6)|0);
    const gy0 = Math.max(0, ((y-r)/6)|0), gy1 = Math.min(GH-1, ((y+r)/6)|0);
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) st.grid[gy*GW+gx] = 1;
  }
  const isCovered = (x, y) => st.grid[(((y/6)|0)*GW) + ((x/6)|0)] === 1;
  function strokeProgress(s){
    let c = 0, n = 0;
    for (let i = 0; i < s.pts.length; i++) {
      if (i % 2) continue;
      n++;
      if (isCovered(s.pts[i][0], s.pts[i][1])) c++;
    }
    return n ? c/n : 0;
  }
  function refresh(){
    st.done = st.strokes.map(strokeProgress);
    const doneCount = st.done.filter(v => v >= .72).length;
    st.covered = st.strokes.length ? doneCount / st.strokes.length : 0;
    q("#bdProg").textContent = "已刻 " + Math.round(st.covered*100) + "%";
    q("#bdMsg").textContent = st.covered >= .85 ? "这版刻得差不多了，去上墨" : "";
  }

  function render(){
    if (!bw || !st.wood) return;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(st.wood,0,0);
    ctx.save(); ctx.scale(dpr,dpr);
    const V = activeView(), X = V.x, Y = V.y, W = V.w, H = V.h;
    const map = p => [X + p[0]/MW*W, Y + p[1]/MH*H];
    if (st.tpl && st.tpl.guide && st.step <= 1) {
      ctx.save(); ctx.globalAlpha = .62; ctx.drawImage(st.tpl.guide, X, Y, W, H); ctx.restore();
    }
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (st.cutDirect) {
      const gc = tint(st.cutDirect, "#FCF2DA");
      ctx.save(); ctx.globalAlpha = .96; ctx.drawImage(gc, X, Y, W, H); ctx.restore();
    }
    st.cuts.forEach(line => {
      if (!line.pts.length) return;
      const path = () => {
        ctx.beginPath();
        line.pts.forEach((p,i) => { const [px,py] = map([p.x, p.y]); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); });
      };
      path(); ctx.strokeStyle = "rgba(40,20,6,.72)"; ctx.lineWidth = line.w*1.75*view.zoom; ctx.stroke();
      path(); ctx.strokeStyle = "#FCF2DA"; ctx.lineWidth = line.w*view.zoom; ctx.stroke();
      path(); ctx.strokeStyle = "rgba(108,74,38,.6)"; ctx.lineWidth = Math.max(1.2, line.w*.32)*view.zoom; ctx.stroke();
    });
    ctx.restore();
    if (st.inkCv) { ctx.save(); ctx.drawImage(st.inkCv, X, Y, W, H); ctx.restore(); }
    ctx.restore();
  }

  const toMask = e => {
    const r = cv.getBoundingClientRect();
    const V = activeView();
    return [(e.clientX - r.left - V.x)/V.w*MW, (e.clientY - r.top - V.y)/V.h*MH];
  };
  function carvePoint(x, y, from, w){
    const r = Math.max(2, w*.55);
    if (from) {
      const d = Math.hypot(x-from[0], y-from[1]), n = Math.max(1, Math.ceil(d/(r*.8)));
      for (let i = 1; i <= n; i++) markGrid(L(from[0],x,i/n), L(from[1],y,i/n), r);
    } else markGrid(x,y,r);
  }
  function buildCutMask(){
    if (st.cutDirect) return st.cutDirect;
    if (st.cutMask) return st.cutMask;
    const c = document.createElement("canvas"); c.width = MW; c.height = MH;
    const g = c.getContext("2d");
    g.strokeStyle = "#fff"; g.lineCap = g.lineJoin = "round";
    st.cuts.forEach(line => {
      g.lineWidth = Math.max(2, line.w*MW/fit.w);
      g.beginPath();
      line.pts.forEach((p,i) => i ? g.lineTo(p.x,p.y) : g.moveTo(p.x,p.y));
      if (line.pts.length === 1) g.lineTo(line.pts[0].x+.1, line.pts[0].y+.1);
      g.stroke();
    });
    st.cutMask = c;
    return c;
  }
  function punchCarve(){
    if (!st.inkCtx) return;
    st.inkCtx.save();
    st.inkCtx.globalCompositeOperation = "destination-out";
    st.inkCtx.drawImage(buildCutMask(), 0, 0);
    st.inkCtx.restore();
  }
  /* 一笔：按当前画笔样式画在版面上（坐标是模板坐标） */
  function paintAt(from, to){
    if (!st.inkCv) {
      st.inkCv = document.createElement("canvas"); st.inkCv.width = MW; st.inkCv.height = MH;
      st.inkCtx = st.inkCv.getContext("2d");
    }
    const g = st.inkCtx;
    const w = st.penW * (MW / fit.w);
    const [x0, y0] = from, [x1, y1] = to;
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
    g.strokeStyle = st.ink; g.fillStyle = st.ink;
    g.lineCap = st.pen === "flat" ? "square" : "round";
    g.lineJoin = "round";
    if (st.pen === "round" || st.pen === "flat") {
      g.lineWidth = w;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    } else if (st.pen === "dry") {
      for (let k = 0; k < 7; k++) {
        const off = (Math.random() - .5) * w * .85;
        g.globalAlpha = .18 + Math.random() * .35;
        g.lineWidth = Math.max(1, w * (.07 + Math.random() * .13));
        g.beginPath();
        g.moveTo(x0 + off, y0 + off * .6);
        g.lineTo(x1 + off, y1 + off * .6);
        g.stroke();
      }
    } else if (st.pen === "splash") {
      /* 泼墨：大小不一的墨点 + 飞溅的小点 */
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.max(3, Math.round(dist * .12 + 3));
      for (let k = 0; k < n; k++) {
        const t = Math.random();
        const cx = L(x0, x1, t) + (Math.random() - .5) * w * 1.5;
        const cy = L(y0, y1, t) + (Math.random() - .5) * w * 1.5;
        g.globalAlpha = .32 + Math.random() * .55;
        g.beginPath();
        g.arc(cx, cy, Math.max(1, w * (.06 + Math.random() * .3)), 0, 6.2832);
        g.fill();
        for (let m = 0; m < 4; m++) {
          g.globalAlpha = .2 + Math.random() * .5;
          g.beginPath();
          g.arc(cx + (Math.random() - .5) * w * 2.1, cy + (Math.random() - .5) * w * 2.1,
                Math.max(.6, w * (.015 + Math.random() * .03)), 0, 6.2832);
          g.fill();
        }
      }
    } else {
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.max(8, Math.round((dist + w * .6) * .55));
      for (let k = 0; k < n; k++) {
        const t = Math.random();
        const cx = L(x0, x1, t) + (Math.random() - .5) * w;
        const cy = L(y0, y1, t) + (Math.random() - .5) * w;
        g.globalAlpha = .08 + Math.random() * .28;
        g.beginPath();
        g.arc(cx, cy, Math.max(.8, w * (.02 + Math.random() * .05)), 0, 6.2832);
        g.fill();
      }
    }
    g.globalAlpha = 1;
    punchCarve();
    render();
  }

  cv.addEventListener("pointerdown", e => {
    if (st.busy) return;
    cv.setPointerCapture(e.pointerId);
    const p = toMask(e);
    const inside = p[0] >= 0 && p[0] <= MW && p[1] >= 0 && p[1] <= MH;
    if (st.step === 1) {
      if (!inside) return;
      st.drawing = true;
      const line = { w: st.w, pts: [{x:p[0],y:p[1]}] };
      st.cuts.push(line); st.cur = line; st.cutMask = null;
      carvePoint(p[0],p[1],null,st.w);
      refresh(); render();
    } else if (st.step === 2) {
      if (!inside) return;
      st.painting = true;
      st.lastPaint = p;
      paintAt(p, [p[0] + .1, p[1]]);
    }
  });
  cv.addEventListener("pointermove", e => {
    const p = toMask(e);
    if (st.drawing && st.cur) {
      const last = st.cur.pts[st.cur.pts.length-1];
      if (Math.hypot(p[0]-last.x, p[1]-last.y) < 1.2) return;
      st.cur.pts.push({x:p[0],y:p[1]});
      carvePoint(p[0],p[1],[last.x,last.y],st.cur.w);
      render();
    } else if (st.painting && st.step === 2 && st.inkCtx) {
      paintAt(st.lastPaint || p, p);
    }
    st.lastPaint = p;
  });
  const endStroke = () => {
    if (st.drawing) { st.drawing = false; st.cur = null; refresh(); }
    if (st.painting) st.painting = false;
    st.lastPaint = null;
    render();
  };
  cv.addEventListener("pointerup", endStroke);
  cv.addEventListener("pointercancel", endStroke);
  cv.addEventListener("pointerleave", endStroke);

  wrap.addEventListener("wheel", e => {
    if (!e.altKey || !document.body.contains(cv) || q("#bdShelf").classList.contains("on") ||
        q("#bdRulesModal").classList.contains("on")) return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    zoomAt(view.zoom * Math.exp(-e.deltaY * .0015), e.clientX-r.left, e.clientY-r.top);
  }, { passive:false });

  wrap.addEventListener("pointerdown", e => {
    if (!spaceHeld || e.button !== 0 || st.busy) return;
    e.preventDefault(); e.stopPropagation();
    panDrag = { id:e.pointerId, x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false };
    wrap.setPointerCapture(e.pointerId);
    wrap.classList.add("panning");
  }, true);
  wrap.addEventListener("pointermove", e => {
    if (!panDrag || e.pointerId !== panDrag.id) return;
    e.preventDefault(); e.stopPropagation();
    const dx = e.clientX-panDrag.x, dy = e.clientY-panDrag.y;
    panDrag.moved = panDrag.moved || Math.abs(dx)+Math.abs(dy) > 2;
    view.x = panDrag.vx + dx; view.y = panDrag.vy + dy;
    clampView(); render();
    if (st.inkCv) drawPrint(st.press);
  }, true);
  function endPan(e){
    if (!panDrag || (e && e.pointerId !== panDrag.id)) return;
    suppressPress = suppressPress || panDrag.moved;
    panDrag = null;
    wrap.classList.remove("panning");
  }
  wrap.addEventListener("pointerup", endPan, true);
  wrap.addEventListener("pointercancel", endPan, true);
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || e.repeat || !document.body.contains(cv)) return;
    if (q("#bdShelf").classList.contains("on") || q("#bdRulesModal").classList.contains("on")) return;
    const a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT|BUTTON/.test(a.tagName)) return;
    e.preventDefault(); spaceHeld = true; wrap.classList.add("pan-ready");
  }, { passive:false });
  document.addEventListener("keyup", e => {
    if (e.code !== "Space") return;
    spaceHeld = false; wrap.classList.remove("pan-ready");
    if (panDrag) endPan();
  });
  addEventListener("blur", () => { spaceHeld = false; wrap.classList.remove("pan-ready","panning"); panDrag = null; });

  function setStep(n){
    st.step = n;
    q("#bdSteps").querySelectorAll("li").forEach(li => {
      const s = +li.dataset.s;
      li.classList.toggle("on", s === n);
      li.classList.toggle("done", s < n);
    });
    q("#bdKnifePanel").hidden = n !== 1;
    q("#bdInkPanel").hidden = n !== 2;
    q("#bdPaperPanel").hidden = n !== 3;
    q("#bdPeelPanel").hidden = n !== 4;
    q("#bdDonePanel").hidden = n !== 5;
    wrap.classList.toggle("lock", n !== 1 && n !== 2);
    if (n === 1) refresh();
    if (n === 2) { st.cutMask = null; q("#bdMsg").textContent = "选色，直接在版上涂"; }
    if (n === 3) { q("#bdLay").disabled = false; q("#bdMsg").textContent = ""; }
    if (n === 5) q("#bdMsg").textContent = "这一张印好了";
    render();
  }

  async function selectTemplate(t, silent){
    if (!t || st.busy) return;
    st.busy = true;
    q("#bdNow").textContent = t.name;
    q("#bdCount").textContent = TPLS.length + " 张 · " + t.name;
    try {
      await buildTemplate(t);
      st.tpl = t; st.strokes = t.strokes2;
      st.cuts = []; st.inkCv = null; st.inkCtx = null; st.cutMask = null; st.cutDirect = null; st.press = 0;
      resetView();
      makeGrid(); refresh();
      paperEl.className = "bd-paper";
      setStep(1);
      buildShelf();
    } catch (err) {
      console.error("[刻痕] 模板载入失败", t && t.name, err);
      q("#bdMsg").textContent = "「" + (t ? t.name : "模板") + "」载入失败：" + (err && err.message ? err.message : err);
    }
    st.busy = false;
    if (!silent) render();
  }

  function thumb(t){
    const w = 240, h = 174;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = "#EFE9DD"; g.fillRect(0,0,w,h);
    if (t.kind === "vec") {
      g.strokeStyle = "rgba(20,16,12,.85)"; g.lineCap = g.lineJoin = "round";
      t.strokes.forEach(s => {
        g.lineWidth = Math.max(1, s.w*.2);
        g.beginPath();
        s.pts.forEach((p,i) => i ? g.lineTo(p[0]*w,p[1]*h) : g.moveTo(p[0]*w,p[1]*h));
        g.stroke();
      });
    } else if (t.img) {
      /* 和描摹同一套处理：先阈值，再把整行/整列的格线剔掉 */
      const k = Math.min(w/t.img.naturalWidth, h/t.img.naturalHeight) * .94;
      const iw = Math.round(t.img.naturalWidth*k), ih = Math.round(t.img.naturalHeight*k);
      g.drawImage(t.img, Math.round((w-iw)/2), Math.round((h-ih)/2), iw, ih);
      const src = g.getImageData(0, 0, w, h), d2 = src.data;
      const bin = new Uint8Array(w*h);
      for (let i = 0; i < bin.length; i++) bin[i] = (.299*d2[i*4] + .587*d2[i*4+1] + .114*d2[i*4+2]) < 185 ? 1 : 0;
      for (let i = 0; i < bin.length; i++) {
        const on = bin[i];
        d2[i*4] = on ? 26 : 239; d2[i*4+1] = on ? 18 : 233; d2[i*4+2] = on ? 12 : 221; d2[i*4+3] = 255;
      }
      g.putImageData(src, 0, 0);
    } else {
      g.fillStyle = "rgba(20,16,12,.35)"; g.font = "12px monospace"; g.fillText(t.name, 12, h/2);
    }
    return c.toDataURL("image/png");
  }
  function buildShelf(){
    const grid = q("#bdShelfGrid");
    grid.innerHTML = TPLS.map((t,i) =>
      '<button class="bd-cell' + (st.tpl && st.tpl.id === t.id ? " on" : "") + '" type="button" data-i="' + i + '">' +
        '<img src="' + (t.thumb || (t.thumb = thumb(t))) + '" alt="' + t.name + '" /><span>' + t.name + '</span></button>').join("");
    grid.querySelectorAll(".bd-cell").forEach(b => b.addEventListener("click", () => {
      const t = TPLS[+b.dataset.i];
      closeShelf(); selectTemplate(t);
    }));
    q("#bdShelfCount").textContent = TPLS.length + " 张";
    root.querySelectorAll("[data-thumb]").forEach((c,i) => {
      const t = TPLS[i]; if (!t) return;
      const g = c.getContext("2d");
      c.width = 200; c.height = 150;
      const img = new Image();
      const src = t.thumb || (t.thumb = thumb(t));
      /* 文件夹正面只露出纸的上沿，缩略图上移一点，让图案落在能看见的那一条里 */
      img.onload = () => { g.clearRect(0, 0, 200, 150); g.drawImage(img, 0, -40, 200, 150); };
      img.src = src;
    });
  }
  const openShelf = () => { q("#bdShelf").classList.add("on"); q("#bdShelfX").focus(); };
  const closeShelf = () => q("#bdShelf").classList.remove("on");
  const rulesModal = q("#bdRulesModal");
  const openRules = () => { rulesModal.classList.add("on"); q("#bdRulesX").focus(); };
  const closeRules = () => rulesModal.classList.remove("on");
  q("#bdFolder").addEventListener("click", openShelf);
  q("#bdShelfX").addEventListener("click", closeShelf);
  q("#bdShelf").addEventListener("click", e => { if (e.target.id === "bdShelf") closeShelf(); });
  q("#bdRulesBtn").addEventListener("click", openRules);
  q("#bdRulesX").addEventListener("click", closeRules);
  rulesModal.addEventListener("click", e => { if (e.target === rulesModal) closeRules(); });
  document.addEventListener("keydown", e => {
    if (!document.body.contains(cv)) return;
    if (e.key === "Escape" && q("#bdShelf").classList.contains("on")) { e.stopPropagation(); closeShelf(); }
    else if (e.key === "Escape" && rulesModal.classList.contains("on")) { e.stopPropagation(); closeRules(); }
  }, true);

  q("#bdSwatches").innerHTML = INKS.map((c,i) =>
    '<button class="bd-sw' + (i===0?' on':'') + '" type="button" data-v="' + c.v + '" title="' + c.name +
    '" style="background:' + c.v + '"></button>').join("") +
    '<label class="bd-sw bd-sw-more" title="自定义颜色"><input type="color" id="bdCustom" value="#171210" /></label>';
  q("#bdSwatches").addEventListener("click", e => {
    const b = e.target.closest(".bd-sw"); if (!b) return;
    if (b.classList.contains("bd-sw-more")) return;
    st.ink = b.dataset.v;
    q("#bdSwatches").querySelectorAll(".bd-sw").forEach(x => x.classList.toggle("on", x === b));
  });
  q("#bdCustom").addEventListener("input", e => {
    st.ink = e.target.value;
    q("#bdSwatches").querySelectorAll(".bd-sw").forEach(x => x.classList.remove("on"));
    e.target.closest(".bd-sw").classList.add("on");
  });

  const PEN_NAME = { round:"圆头", flat:"平头", dry:"干刷", spray:"点彩", splash:"泼墨" };
  q("#bdPens").addEventListener("click", e => {
    const b = e.target.closest("button[data-p]"); if (!b) return;
    st.pen = b.dataset.p;
    q("#bdPens").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    q("#bdPenName").textContent = PEN_NAME[st.pen];
  });
  q("#bdPenW").addEventListener("input", e => {
    st.penW = +e.target.value;
    q("#bdPenWv").textContent = st.penW;
  });

  function drawPrint(progress){
    if (!st.paperTex) return;
    pctx.setTransform(1,0,0,1,0,0);
    pctx.clearRect(0,0,pcan.width,pcan.height);
    pctx.drawImage(st.paperTex, 0, 0);
    if (!st.inkCv) return;
    const V = activeView();
    const X = (V.x - paperEl.offsetLeft)*dpr, Y = (V.y - paperEl.offsetTop)*dpr;
    const W = V.w*dpr, H = V.h*dpr;
    const r = Math.max(W,H) * (.28 + .95*progress);
    pctx.save();
    pctx.beginPath(); pctx.arc(X+W/2, Y+H/2, r, 0, 6.2832); pctx.clip();
    pctx.globalCompositeOperation = "multiply";
    pctx.drawImage(st.inkCv, X, Y, W, H);
    pctx.restore();
  }
  function layPaper(){
    if (st.step !== 3) return;
    st.press = 0;
    paperEl.className = "bd-paper";
    requestAnimationFrame(() => paperEl.classList.add("down"));
    drawPrint(0);
    q("#bdPressTip").textContent = "已压 0 / 3";
    q("#bdMsg").textContent = "点画板三下压印";
    q("#bdLay").disabled = true;
  }
  q("#bdLay").addEventListener("click", layPaper);
  /* 纸放下之后，点画板任何位置都算压一下（不必非点在纸面上） */
  wrap.addEventListener("click", () => {
    if (suppressPress) { suppressPress = false; return; }
    if (st.step !== 3 || !paperEl.classList.contains("down")) return;
    st.press = Math.min(1, st.press + 1/3);
    drawPrint(st.press);
    q("#bdPressTip").textContent = "已压 " + Math.round(st.press*3) + " / 3";
    if (st.press >= .99) { q("#bdMsg").textContent = "压透了，可以揭纸"; setTimeout(() => { if (st.step === 3) setStep(4); }, 340); }
  });
  q("#bdPeel").addEventListener("click", () => {
    if (st.step !== 4) return;
    paperEl.classList.remove("down"); paperEl.classList.add("peel");
    setTimeout(() => { paperEl.classList.remove("peel"); paperEl.classList.add("up"); setStep(5); }, 860);
  });
  q("#bdSave").addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "刻痕-印张-" + (st.tpl ? st.tpl.name : "作品") + ".png";
    a.href = pcan.toDataURL("image/png"); a.click();
  });
  q("#bdAgain").addEventListener("click", () => {
    paperEl.className = "bd-paper";

  /* ---------- 自动演示 ---------- */

  function maskCoverage(){

  async function demo(){

      st.tpl = t; st.strokes = t.strokes2;
      q("#bdNow").textContent = t.name;
      q("#bdCount").textContent = TPLS.length + " 张 · " + t.name;
      paperEl.className = "bd-paper";
      q("#bdLay").disabled = false;
      st.cuts = []; st.cutMask = null; st.inkCv = null; st.inkCtx = null; st.press = 0;
      makeGrid(); setStep(1);
      await wait(220);
      const KNIFE = 7, SPEED = 1400;          // 统一用 7px 的刀，按弧长匀速走
      const chaikin = (pts, iters = 2) => {
        let p = pts;
        for (let it = 0; it < iters && p.length > 2; it++) {
          const o = [p[0]];
          for (let i = 0; i < p.length - 1; i++) {
            const a = p[i], b = p[i+1];
            o.push([a[0]*.75 + b[0]*.25, a[1]*.75 + b[1]*.25]);
            o.push([a[0]*.25 + b[0]*.75, a[1]*.25 + b[1]*.75]);
          }
          o.push(p[p.length-1]);
          p = o;
        }
        return p;
      };
      function traceSmooth(line, pts, width, speed){
        return new Promise(resolve => {
          const cum = [0], effective = [0];
          for (let i = 1; i < pts.length; i++) {
            const segment = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
            cum.push(cum[i-1] + segment);
            const prior = isCovered(pts[i-1][0], pts[i-1][1]) && isCovered(pts[i][0], pts[i][1]);
            effective.push(effective[i-1] + (prior ? 0 : segment));
          }
          const total = effective[effective.length-1] || 0;
          if (total < .5) {
            for (let i = 1; i < pts.length; i++) line.pts.push({ x:pts[i][0], y:pts[i][1] });
            resolve(); return;
          }
          const duration = Math.max(280, total / speed * 1000);
          let cursor = 0, head = line.pts[0], start = 0, lastRefresh = 0;
          function frame(now){
            if (!start) start = now;
            const u = Math.min(1, (now-start) / duration);
            /* 只做很轻的缓入缓出，整条线仍保持连续走刀，不在中途顿住 */
            const travel = total * (u - .035 * Math.sin(u * Math.PI * 2));
            let ec = 0;
            while (ec < pts.length-1 && effective[ec+1] <= travel) ec++;
            let reach = cum[ec];
            if (ec < pts.length-1 && effective[ec+1] > effective[ec]) {
              const t = (travel-effective[ec]) / (effective[ec+1]-effective[ec]);
              reach += (cum[ec+1]-cum[ec]) * Math.max(0, Math.min(1, t));
            }
            const ox = head.x, oy = head.y;
            while (cursor < pts.length-1 && cum[cursor+1] <= reach) {
              const q = pts[++cursor];
              head = { x:q[0], y:q[1] };
              line.pts.push(head);
            }
            if (cursor < pts.length-1) {
              const seg = Math.max(.001, cum[cursor+1] - cum[cursor]);
              const t = Math.max(0, Math.min(1, (reach-cum[cursor]) / seg));
              const a = pts[cursor], b = pts[cursor+1];
              head.x = a[0] + (b[0]-a[0]) * t;
              head.y = a[1] + (b[1]-a[1]) * t;
            }
            carvePoint(head.x, head.y, [ox, oy], width);

          const pts = chaikin(s.pts, 2);

function chipInk(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (.299*r + .587*g + .114*b) > 158 ? "#17120e" : "#f8f1e6";
}

function exMakers(root){
  root.innerHTML =
  '<div class="mk-grid" id="mkGrid">' + MAKERS.map((m, i) =>
    '<button class="mk-tile" type="button" data-i="' + i + '" aria-label="查看' + m.full + '简介">' +
      '<div class="mk-photo" style="--photo:url(\'' + m.img + '\');--pos:' + m.pos + '"><img src="' + m.img + '" alt="' + m.full + '" /><span class="mk-no">' + String(i + 1).padStart(2, "0") + '</span></div>' +
      '<div class="mk-info"><div><b>' + m.name + '</b><span>' + m.role + '</span></div><em class="mk-era">' + m.years + '</em></div>' +
    '</button>').join("") + '</div>' +
  '<div class="maker-modal" id="makerModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="makerModalTitle">' +
    '<article class="maker-glow-card" id="makerGlowCard">' +
      '<button class="yy-x maker-glow-close" id="makerClose" type="button" aria-label="关闭">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg>' +
      '</button>' +
      '<div class="maker-glow-pic"><img id="makerModalImg" src="' + MAKERS[0].img + '" alt="' + MAKERS[0].full + '" /></div>' +
      '<div class="maker-glow-copy">' +
        '<h3 id="makerModalTitle">' + MAKERS[0].full + '</h3>' +
        '<p class="maker-glow-role" id="makerModalRole"></p>' +
        '<div id="makerModalParas"></div>' +
        '<div class="maker-glow-tags" id="makerModalTags"></div>' +
        '<p class="maker-glow-src" id="makerModalSrc"></p>' +
      '</div>' +
    '</article>' +
  '</div>';
  const modal = $("#makerModal", root), card = $("#makerGlowCard", root);
  let lastFocus = null;
  const openMaker = i => {
    const m = MAKERS[i];
    lastFocus = $("#mkGrid .mk-tile[data-i='" + i + "']", root);
    $("#makerModalImg", root).src = m.img;
    $("#makerModalImg", root).alt = m.full;
    $("#makerModalImg", root).style.objectPosition = m.pos;
    $(".maker-glow-pic", root).style.setProperty("--photo", "url('" + m.img + "')");
    $("#makerModalTitle", root).textContent = m.full;
    $("#makerModalRole", root).textContent = m.role + " · " + m.years;
    $("#makerModalParas", root).innerHTML = m.paras.map(p => "<p>" + p + "</p>").join("");
    $("#makerModalTags", root).innerHTML = m.tags.map(t => "<span>" + t + "</span>").join("");
    $("#makerModalSrc", root).textContent = "照片：" + m.photo + "。资料：" + m.src;
    modal.classList.add("on");
    modal.setAttribute("aria-hidden", "false");
    card.scrollTop = 0;
    $("#makerClose", root).focus();
  };
  const closeMaker = () => {
    modal.classList.remove("on");
    modal.setAttribute("aria-hidden", "true");
    if (lastFocus) lastFocus.focus();
  };
  $("#mkGrid", root).addEventListener("click", e => {
    const tile = e.target.closest(".mk-tile");
    if (tile) openMaker(+tile.dataset.i);
  });
  $("#makerClose", root).addEventListener("click", closeMaker);
  modal.addEventListener("click", e => { if (e.target === modal) closeMaker(); });
  root.addEventListener("keydown", e => {
    if (e.key === "Escape" && modal.classList.contains("on")) { e.stopPropagation(); closeMaker(); }
  });
  MAKERS.forEach(m => { const img = new Image(); img.src = m.img; });
}
