/* ============================================================
   首屏 · ShapeWaves（React Bits 组件的原生实现）
   原组件是 React + vgpu；这个项目是单文件静态页、没有构建流程，
   所以把它的管线用原生 WebGPU 重写：同一套 WGSL、同一组参数，
   不引入 React / vgpu / 打包工具。WebGPU 不可用时抛错，由上层回落到网点显影。
   ============================================================ */
const SW_SHAPE_MODES = { mixed: 0, squares: 1, circles: 2, triangles: 3 };
const SW_NOISE_CELLS = 32;
const SW_TIME_RATE = 0.1;
const SW_SIM_STEP = 1 / 60;
const SW_WAVE_SPEED = 0.42;
const SW_WAVE_FRICTION = 0.94;
const SW_WAVE_DECAY = 0.972;
const SW_SETTLED = 0.01;
const SW_INTRO_BAND = 0.2, SW_INTRO_WARP = 0.3, SW_INTRO_JITTER = 0.16;
const SW_INTRO_END = 1 + SW_INTRO_WARP + SW_INTRO_JITTER + SW_INTRO_BAND;

const SW = {
  text: "",
  fontFamily: '"Noto Serif SC","Songti SC",STSong,serif',
  fontWeight: 700,
  textSize: 0.44,
  textShift: 0.13,
  shapes: "mixed",
  cellSize: 10,
  dotSize: 0.75,
  color: "#EDE8DE",
  hoverColor: "#FFFFFF",
  backgroundColor: "#14110E",
  speed: 1,
  scale: 1,
  contrast: 1,
  brightness: 0.4,
  flow: 0,
  direction: 0,
  fade: 0.25,
  interactive: true,
  splashRadius: 40,
  splashStrength: 0.4,
  glow: 0.35,
  intro: true,
  introDuration: 1.6
};

const SW_NOISE_WGSL = `
fn mod289v3(x: vec3f) -> vec3f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn mod289v4(x: vec4f) -> vec4f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn permute(x: vec4f) -> vec4f { return mod289v4(((x * 34.0) + 10.0) * x); }
fn taylorInvSqrt(r: vec4f) -> vec4f { return 1.79284291400159 - 0.85373472095314 * r; }
fn fadeCurve(t: vec3f) -> vec3f { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }

fn cnoise(P: vec3f) -> f32 {
  var Pi0 = floor(P);
  var Pi1 = Pi0 + vec3f(1.0);
  Pi0 = mod289v3(Pi0);
  Pi1 = mod289v3(Pi1);
  let Pf0 = fract(P);
  let Pf1 = Pf0 - vec3f(1.0);
  let ix = vec4f(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
  let iy = vec4f(Pi0.yy, Pi1.yy);
  let iz0 = Pi0.zzzz;
  let iz1 = Pi1.zzzz;

  let ixy = permute(permute(ix) + iy);
  let ixy0 = permute(ixy + iz0);
  let ixy1 = permute(ixy + iz1);

  var gx0 = ixy0 * (1.0 / 7.0);
  var gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
  gx0 = fract(gx0);
  let gz0 = vec4f(0.5) - abs(gx0) - abs(gy0);
  let sz0 = step(gz0, vec4f(0.0));
  gx0 -= sz0 * (step(vec4f(0.0), gx0) - 0.5);
  gy0 -= sz0 * (step(vec4f(0.0), gy0) - 0.5);

  var gx1 = ixy1 * (1.0 / 7.0);
  var gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
  gx1 = fract(gx1);
  let gz1 = vec4f(0.5) - abs(gx1) - abs(gy1);
  let sz1 = step(gz1, vec4f(0.0));
  gx1 -= sz1 * (step(vec4f(0.0), gx1) - 0.5);
  gy1 -= sz1 * (step(vec4f(0.0), gy1) - 0.5);

  var g000 = vec3f(gx0.x, gy0.x, gz0.x);
  var g100 = vec3f(gx0.y, gy0.y, gz0.y);
  var g010 = vec3f(gx0.z, gy0.z, gz0.z);
  var g110 = vec3f(gx0.w, gy0.w, gz0.w);
  var g001 = vec3f(gx1.x, gy1.x, gz1.x);
  var g101 = vec3f(gx1.y, gy1.y, gz1.y);
  var g011 = vec3f(gx1.z, gy1.z, gz1.z);
  var g111 = vec3f(gx1.w, gy1.w, gz1.w);

  let norm0 = taylorInvSqrt(vec4f(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
  g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
  let norm1 = taylorInvSqrt(vec4f(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
  g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;

  let n000 = dot(g000, Pf0);
  let n100 = dot(g100, vec3f(Pf1.x, Pf0.yz));
  let n010 = dot(g010, vec3f(Pf0.x, Pf1.y, Pf0.z));
  let n110 = dot(g110, vec3f(Pf1.xy, Pf0.z));
  let n001 = dot(g001, vec3f(Pf0.xy, Pf1.z));
  let n101 = dot(g101, vec3f(Pf1.x, Pf0.y, Pf1.z));
  let n011 = dot(g011, vec3f(Pf0.x, Pf1.yz));
  let n111 = dot(g111, Pf1);

  let f = fadeCurve(Pf0);
  let nz = mix(vec4f(n000, n100, n010, n110), vec4f(n001, n101, n011, n111), f.z);
  let ny = mix(nz.xy, nz.zw, f.y);
  return 2.2 * mix(ny.x, ny.y, f.x);
}

fn fbm(p: vec3f) -> f32 {
  var total = 0.0;
  var amplitude = 1.0;
  var weight = 0.0;
  var frequency = 1.0;
  for (var i = 0; i < 2; i++) {
    total += amplitude * cnoise(p * frequency);
    weight += amplitude;
    amplitude *= 0.5;
    frequency *= 2.0;
  }
  return total / weight;
}
`;

const SW_VS = `
struct VSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs_main(@builtin(vertex_index) i: u32) -> VSOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VSOut;
  let q = p[i];
  o.pos = vec4f(q, 0.0, 1.0);
  o.uv = vec2f((q.x + 1.0) * 0.5, (1.0 - q.y) * 0.5);
  return o;
}
`;

const SW_SCENE_FS = `
struct Params {
  resolution: vec4f,
  placement: vec4f,
  grid: vec4f,
  field: vec4f,
  motion: vec4f,
  color: vec4f,
  hover: vec4f,
  background: vec4f,
}
@group(0) @binding(0) var<uniform> params: Params;
@group(0) @binding(1) var maskTexture: texture_2d<f32>;
@group(0) @binding(2) var maskSampler: sampler;
@group(0) @binding(3) var<storage, read> charges: array<f32>;

const SEED = vec2f(12.9898, 78.233);
const GLOW_THRESHOLD = 0.6;
${SW_NOISE_WGSL}

fn sdIsoscelesTriangle(point: vec2f, q: vec2f) -> f32 {
  let p = vec2f(abs(point.x), point.y);
  let a = p - q * clamp(dot(p, q) / dot(q, q), 0.0, 1.0);
  let b = p - q * vec2f(clamp(p.x / q.x, 0.0, 1.0), 1.0);
  let s = -sign(q.y);
  let d = min(vec2f(dot(a, a), s * (p.x * q.y - p.y * q.x)), vec2f(dot(b, b), s * (p.y - q.y)));
  return -sqrt(d.x) * sign(d.y);
}

fn shapeDistance(p: vec2f, shape: i32, c: f32) -> f32 {
  if (shape == 0) { return max(abs(p.x), abs(p.y)) - c; }
  if (shape == 1) { return length(p) - c; }
  return sdIsoscelesTriangle(vec2f(p.x, p.y + c), vec2f(c, 2.0 * c));
}

fn hash21(p: vec2f) -> f32 {
  return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453);
}

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let resolution = params.resolution.xy;
  let cellPx = params.grid.x;
  let dotSize = params.grid.y;
  let mode = i32(params.grid.z + 0.5);
  let cols = i32(params.grid.w + 0.5);
  let background = params.background.rgb;
  let toSurface = params.hover.w < 0.5;

  let pixel = uv * resolution;
  let origin = params.placement.xy;
  let rows = i32(params.placement.z + 0.5);
  let cell = floor((pixel - origin) / cellPx);
  if (cell.y < 0.0 || i32(cell.y) >= rows || cell.x < 0.0 || i32(cell.x) >= cols) {
    return vec4f(background, select(0.0, 1.0, toSurface));
  }
  let center = origin + (cell + 0.5) * cellPx;
  let local = (pixel - center) / (cellPx * 0.5);
  let cellUv = center / resolution;

  if (params.motion.z > 0.5 && textureSampleLevel(maskTexture, maskSampler, cellUv, 0.0).r > 0.5) {
    return vec4f(background, select(0.0, 1.0, toSurface));
  }

  var level = 1.0;
  let fade = params.motion.w;
  if (fade > 0.0) {
    let q = abs(uv * 2.0 - 1.0);
    let radius = pow(pow(q.x, 2.5) + pow(q.y, 2.5), 1.0 / 2.5) / pow(2.0, 1.0 / 2.5);
    level = 1.0 - smoothstep(max(0.0, 1.0 - fade * 2.2), 1.0, radius);
  }
  let noise = fbm(vec3f((center + params.motion.xy) / params.field.x + SEED, params.field.w));
  let tone = clamp((noise * 0.5 + 0.5 - params.field.y) * params.field.z + 0.5, 0.0, 1.0);
  let band = i32(min(tone, 0.999999) * 3.0);

  var charge = 0.0;
  let index = i32(cell.y) * cols + i32(cell.x);
  if (index >= 0 && index < i32(arrayLength(&charges))) { charge = charges[index]; }
  let stepped = (band + i32(clamp(charge, 0.0, 0.999) * 3.0)) % 3;

  var shape = 2 - stepped;
  var size = dotSize;
  if (mode != 0) {
    shape = mode - 1;
    size = dotSize * mix(0.45, 1.0, f32(stepped) / 2.0);
  }
  let introProgress = params.placement.w;
  var front = 0.0;
  if (introProgress < ${SW_INTRO_END.toFixed(2)}) {
    let radial = length((center - resolution * 0.5) / (resolution * 0.5)) * 0.70710678;
    let warp = cnoise(vec3f(cellUv * vec2f(3.2, 2.4) + SEED, 4.7)) * ${SW_INTRO_WARP.toFixed(2)};
    let jitter = hash21(cell) * ${SW_INTRO_JITTER.toFixed(2)};
    let spread = radial + warp + jitter + ${SW_INTRO_WARP.toFixed(2)};
    let iband = ${SW_INTRO_BAND.toFixed(2)} * (0.6 + 0.8 * hash21(cell + vec2f(17.0, 9.0)));
    let t = clamp((introProgress - spread) / iband, 0.0, 1.0);
    if (t <= 0.0) {
      return vec4f(background, select(0.0, 1.0, toSurface));
    }
    let back = t - 1.0;
    size = max(size * (1.0 + 2.70158 * back * back * back + 1.70158 * back * back), 0.02);
    front = 1.0 - smoothstep(0.0, 1.0, abs(introProgress - spread) / iband);
  }
  let aa = 2.0 / cellPx;
  let coverage = smoothstep(aa, -aa, shapeDistance(local, shape, size));

  let tint = mix(params.color.rgb, params.hover.rgb, max(smoothstep(0.15, 0.85, charge), front * 0.35));

  let rgb = mix(background, tint, coverage * level);
  if (toSurface) { return vec4f(rgb, 1.0); }
  let luminance = dot(tint * level, vec3f(0.2126, 0.7152, 0.0722));
  let glow = max(0.0, (luminance - GLOW_THRESHOLD) / (1.0 - GLOW_THRESHOLD)) * coverage;
  return vec4f(rgb, glow);
}
`;

const SW_BLUR_FS = `
struct Blur { direction: vec4f }
@group(0) @binding(0) var<uniform> blur: Blur;
@group(0) @binding(1) var sourceTexture: texture_2d<f32>;
@group(0) @binding(2) var sourceSampler: sampler;

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let sigma = blur.direction.z;
  let radius = i32(ceil(3.0 * sigma));
  var sum = vec3f(0.0);
  var weight = 0.0;
  for (var i = -radius; i <= radius; i++) {
    let offset = f32(i);
    let w = exp(-(offset * offset) / (2.0 * sigma * sigma));
    let s = textureSampleLevel(sourceTexture, sourceSampler, uv + offset * blur.direction.xy, 0.0);
    sum += select(s.rgb, s.rgb * s.a, blur.direction.w > 0.5) * w;
    weight += w;
  }
  return vec4f(sum / weight, 1.0);
}
`;

const SW_COMPOSITE_FS = `
struct Composite { strength: vec4f }
@group(0) @binding(0) var<uniform> composite: Composite;
@group(0) @binding(1) var sceneTexture: texture_2d<f32>;
@group(0) @binding(2) var glowTexture: texture_2d<f32>;
@group(0) @binding(3) var linearSampler: sampler;

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let scene = textureSampleLevel(sceneTexture, linearSampler, uv, 0.0).rgb;
  let glow = textureSampleLevel(glowTexture, linearSampler, uv, 0.0).rgb;
  return vec4f(scene + glow * composite.strength.x, 1.0);
}
`;

function swColor(value, fallback){
  const src = typeof value === "string" ? value.trim() : "";
  const m = /^#?([\da-f]{3}|[\da-f]{6})$/i.exec(src) || /^#?([\da-f]{6})$/i.exec(fallback);
  let hex = m[1];
  if(hex.length === 3) hex = hex.replace(/./g, c => c + c);
  return [0, 2, 4].map(o => parseInt(hex.slice(o, o + 2), 16) / 255);
}

async function initShapeWaves(canvas){
  if(!navigator.gpu) throw new Error("WebGPU 不可用");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "low-power" });
  if(!adapter) throw new Error("没有可用的 GPU 适配器");
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext("webgpu");
  if(!ctx) throw new Error("拿不到 webgpu 上下文");
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: "opaque" });

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const U = GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST;
  const paramsBuf = device.createBuffer({ size: 128, usage: U });
  const compositeBuf = device.createBuffer({ size: 16, usage: U });
  const blurXB = device.createBuffer({ size: 16, usage: U });
  const blurYB = device.createBuffer({ size: 16, usage: U });
  const linear = device.createSampler({
    minFilter: "linear", magFilter: "linear",
    addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge"
  });

  /* 遮罩贴图：把字样画进 canvas，再拷成 GPU 贴图，网格会避开字形 */
  const maskCanvas = document.createElement("canvas");
  const maskCtx = maskCanvas.getContext("2d");
  const TEXUSE = GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT;
  let maskTex = device.createTexture({ size: [1, 1], format: "rgba8unorm", usage: TEXUSE });

  const B = GPUShaderStage;
  const sceneLayout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: B.FRAGMENT, buffer: { type: "uniform" } },
    { binding: 1, visibility: B.FRAGMENT, texture: { sampleType: "float" } },
    { binding: 2, visibility: B.FRAGMENT, sampler: { type: "filtering" } },
    { binding: 3, visibility: B.FRAGMENT, buffer: { type: "read-only-storage" } }
  ] });
  const blurLayout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: B.FRAGMENT, buffer: { type: "uniform" } },
    { binding: 1, visibility: B.FRAGMENT, texture: { sampleType: "float" } },
    { binding: 2, visibility: B.FRAGMENT, sampler: { type: "filtering" } }
  ] });
  const compLayout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: B.FRAGMENT, buffer: { type: "uniform" } },
    { binding: 1, visibility: B.FRAGMENT, texture: { sampleType: "float" } },
    { binding: 2, visibility: B.FRAGMENT, texture: { sampleType: "float" } },
    { binding: 3, visibility: B.FRAGMENT, sampler: { type: "filtering" } }
  ] });
  const mkPipe = (code, layout, format) => device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    vertex: { module: device.createShaderModule({ code: SW_VS }), entryPoint: "vs_main" },
    fragment: { module: device.createShaderModule({ code }), entryPoint: "fs_main", targets: [{ format }] },
    primitive: { topology: "triangle-list" }
  });
  const scenePipe = mkPipe(SW_SCENE_FS, sceneLayout, "rgba8unorm");
  const blurPipeX = mkPipe(SW_BLUR_FS, blurLayout, "rgba8unorm");
  const blurPipeY = mkPipe(SW_BLUR_FS, blurLayout, "rgba8unorm");
  const compPipe = mkPipe(SW_COMPOSITE_FS, compLayout, fmt);

  const TARGET_USE = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING;
  const mkTarget = (w, h) => {
    const t = device.createTexture({ size: [w, h], format: "rgba8unorm", usage: TARGET_USE });
    return { tex: t, view: t.createView() };
  };

  let W = 1, H = 1;
  let sceneT = null, glowAT = null, glowBT = null;
  let chargesBuf = null, sceneBG = null, blurXBG = null, blurYBG = null, compBG = null;
  let cols = 1, rows = 1, cellPx = SW.cellSize * dpr, originY = 0;
  let charges = new Float32Array(1), heights = new Float32Array(1), prev = new Float32Array(1);
  let chargesActive = false, backlog = 0;

  const params = new Float32Array(32);
  const compParams = new Float32Array([2 * SW.glow, 0, 0, 0]);
  const cCol = swColor(SW.color, "#EDE8DE");
  const cHover = swColor(SW.hoverColor, "#FFFFFF");
  const cBg = swColor(SW.backgroundColor, "#14110E");

  function buildTargets(w, h){
    W = w; H = h;
    if(sceneT){ sceneT.tex.destroy(); glowAT.tex.destroy(); glowBT.tex.destroy(); }
    sceneT = mkTarget(W, H);
    const gw = Math.max(1, Math.ceil(W / 2)), gh = Math.max(1, Math.ceil(H / 2));
    glowAT = mkTarget(gw, gh);
    glowBT = mkTarget(gw, gh);
    device.queue.writeBuffer(blurXB, 0, new Float32Array([1 / gw, 0, 4, 1]));
    device.queue.writeBuffer(blurYB, 0, new Float32Array([0, 1 / gh, 4, 0]));
    blurXBG = device.createBindGroup({ layout: blurLayout, entries: [
      { binding: 0, resource: { buffer: blurXB } },
      { binding: 1, resource: sceneT.view },
      { binding: 2, resource: linear }
    ] });
    blurYBG = device.createBindGroup({ layout: blurLayout, entries: [
      { binding: 0, resource: { buffer: blurYB } },
      { binding: 1, resource: glowAT.view },
      { binding: 2, resource: linear }
    ] });
    compBG = device.createBindGroup({ layout: compLayout, entries: [
      { binding: 0, resource: { buffer: compositeBuf } },
      { binding: 1, resource: sceneT.view },
      { binding: 2, resource: glowBT.view },
      { binding: 3, resource: linear }
    ] });
  }

  function buildGrid(){
    const nextCols = Math.max(1, Math.round(W / (SW.cellSize * dpr)));
    cellPx = W / nextCols;
    const nextRows = Math.max(1, Math.floor(H / cellPx));
    if(nextCols === cols && nextRows === rows && charges.length === nextCols * nextRows) return;
    cols = nextCols; rows = nextRows;
    originY = (H - rows * cellPx) / 2;
    charges = new Float32Array(cols * rows);
    heights = new Float32Array(cols * rows);
    prev = new Float32Array(cols * rows);
    chargesActive = false;
    if(chargesBuf) chargesBuf.destroy();
    chargesBuf = device.createBuffer({
      size: Math.max(4, charges.byteLength),
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });
    device.queue.writeBuffer(chargesBuf, 0, charges);
    sceneBG = device.createBindGroup({ layout: sceneLayout, entries: [
      { binding: 0, resource: { buffer: paramsBuf } },
      { binding: 1, resource: maskTex.createView() },
      { binding: 2, resource: linear },
      { binding: 3, resource: { buffer: chargesBuf } }
    ] });
  }

  function drawMask(){
    const text = String(SW.text || "").trim();
    const maxMask = 1024;
    const k = text ? Math.min(1, maxMask / Math.max(W, H)) : 0;
    const mw = text ? Math.max(1, Math.round(W * k)) : 1;
    const mh = text ? Math.max(1, Math.round(H * k)) : 1;
    maskCanvas.width = mw; maskCanvas.height = mh;
    maskCtx.fillStyle = "#000";
    maskCtx.fillRect(0, 0, mw, mh);
    if(text){
      let px = Math.max(1, SW.textSize * mh);
      maskCtx.font = SW.fontWeight + " " + px + "px " + SW.fontFamily;
      const measured = maskCtx.measureText(text).width;
      const maxW = mw * 0.9;
      if(measured > maxW){
        px = Math.max(1, (px * maxW) / measured);
        maskCtx.font = SW.fontWeight + " " + px + "px " + SW.fontFamily;
      }
      maskCtx.textAlign = "center";
      maskCtx.textBaseline = "alphabetic";
      const m = maskCtx.measureText(text);
      const x = (mw + m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2 + mw * (SW.textShift || 0);
      const y = (mh + m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      maskCtx.fillStyle = "#fff";
      maskCtx.fillText(text, x, y);
    }
    const next = device.createTexture({ size: [mw, mh], format: "rgba8unorm", usage: TEXUSE });
    device.queue.copyExternalImageToTexture({ source: maskCanvas }, { texture: next }, [mw, mh]);
    maskTex.destroy();
    maskTex = next;
    if(sceneBG){
      sceneBG = device.createBindGroup({ layout: sceneLayout, entries: [
        { binding: 0, resource: { buffer: paramsBuf } },
        { binding: 1, resource: maskTex.createView() },
        { binding: 2, resource: linear },
        { binding: 3, resource: { buffer: chargesBuf } }
      ] });
    }
  }

  /* ---- 指针涟漪：二维波方程，和原组件同一套参数 ---- */
  const pointer = { x: 0, y: 0, at: 0, inside: false };
  function splash(x, y, strength){
    const sigma = Math.max(0.5, ((SW.splashRadius * dpr) / cellPx) * 0.5);
    const reach = Math.ceil(sigma * 2.5);
    const cc = (x * dpr) / cellPx - 0.5;
    const cr = (y * dpr - originY) / cellPx - 0.5;
    const r0 = Math.max(0, Math.floor(cr - reach)), r1 = Math.min(rows - 1, Math.ceil(cr + reach));
    const c0 = Math.max(0, Math.floor(cc - reach)), c1 = Math.min(cols - 1, Math.ceil(cc + reach));
    for(let row = r0; row <= r1; row++){
      const dy = row - cr;
      for(let col = c0; col <= c1; col++){
        const dx = col - cc;
        heights[row * cols + col] = Math.min(1.2,
          heights[row * cols + col] + strength * Math.exp(-(dx*dx + dy*dy) / (2*sigma*sigma)));
      }
    }
    chargesActive = true;
  }
  function stepRipples(){
    const lastCol = cols - 1, lastRow = rows - 1;
    let peak = 0;
    for(let row = 0; row < rows; row++){
      const up = (row === 0 ? row : row - 1) * cols;
      const down = (row === lastRow ? row : row + 1) * cols;
      const base = row * cols;
      for(let col = 0; col < cols; col++){
        const i = base + col;
        const left = base + (col === 0 ? col : col - 1);
        const right = base + (col === lastCol ? col : col + 1);
        const h = heights[i];
        const lap = heights[left] + heights[right] + heights[up + col] + heights[down + col] - 4 * h;
        const v = (h - prev[i]) * SW_WAVE_FRICTION;
        const next = (h + v + SW_WAVE_SPEED * lap) * SW_WAVE_DECAY;
        prev[i] = next;
        const c = Math.min(1, Math.max(0, next));
        charges[i] = c;
        if(c > peak) peak = c;
      }
    }
    const t = heights; heights = prev; prev = t;
    return peak;
  }

  let disposed = false, introAt = 0, introProgress = SW_INTRO_END, time = 0, driftX = 0, driftY = 0;
  let rafId = 0, lastT = 0;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  function render(now){
    rafId = 0;
    if(disposed) return;
    const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
    lastT = now;
    const animating = !document.hidden && !reduceMotion.matches;
    if(animating){
      time += dt * SW_TIME_RATE * SW.speed;
      const a = (SW.direction * Math.PI) / 180, dist = SW.flow * cellPx * dt;
      driftX += Math.cos(a) * dist; driftY += Math.sin(a) * dist;
    }
    /* 涟漪推进 */
    let hovering = false;
    if(chargesActive){
      backlog = Math.min(backlog + dt, SW_SIM_STEP * 4);
      let peak = 1;
      while(backlog >= SW_SIM_STEP){ backlog -= SW_SIM_STEP; peak = stepRipples(); }
      if(peak < SW_SETTLED){
        heights.fill(0); prev.fill(0); charges.fill(0); chargesActive = false;
      } else hovering = true;
      device.queue.writeBuffer(chargesBuf, 0, charges);
    }
    /* 入场：从中心往四角铺开 */
    if(introProgress < SW_INTRO_END){
      introProgress = Math.min(SW_INTRO_END, ((now - introAt) / 1000 / SW.introDuration) * SW_INTRO_END);
    }
    const introPlaying = introProgress < SW_INTRO_END;

    params.set([W, H, 1 / W, 1 / H], 0);
    params.set([0, originY, rows, introProgress], 4);
    params.set([cellPx, Math.min(1, Math.max(0.1, SW.dotSize)), SW_SHAPE_MODES[SW.shapes] ?? 0, cols], 8);
    params.set([SW_NOISE_CELLS * cellPx * SW.scale, 0.5 - (SW.brightness - 0.5) * 0.4, 2.8 * SW.contrast, time], 12);
    params.set([driftX, driftY, String(SW.text || "").trim() ? 1 : 0, SW.fade], 16);
    params.set([cCol[0], cCol[1], cCol[2], 1], 20);
    params.set([cHover[0], cHover[1], cHover[2], SW.glow > 0 ? 1 : 0], 24);
    params.set([cBg[0], cBg[1], cBg[2], 1], 28);
    device.queue.writeBuffer(paramsBuf, 0, params);
    device.queue.writeBuffer(compositeBuf, 0, compParams);

    const enc = device.createCommandEncoder();
    const useGlow = SW.glow > 0;
    if(useGlow){
      let p = enc.beginRenderPass({ colorAttachments: [{ view: sceneT.view, loadOp: "clear", storeOp: "store", clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      p.setPipeline(scenePipe); p.setBindGroup(0, sceneBG); p.draw(3); p.end();
      p = enc.beginRenderPass({ colorAttachments: [{ view: glowAT.view, loadOp: "clear", storeOp: "store", clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      p.setPipeline(blurPipeX); p.setBindGroup(0, blurXBG); p.draw(3); p.end();
      p = enc.beginRenderPass({ colorAttachments: [{ view: glowBT.view, loadOp: "clear", storeOp: "store", clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      p.setPipeline(blurPipeY); p.setBindGroup(0, blurYBG); p.draw(3); p.end();
      p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: { r: cBg[0], g: cBg[1], b: cBg[2], a: 1 } }] });
      p.setPipeline(compPipe); p.setBindGroup(0, compBG); p.draw(3); p.end();
    } else {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: { r: cBg[0], g: cBg[1], b: cBg[2], a: 1 } }] });
      p.setPipeline(scenePipe); p.setBindGroup(0, sceneBG); p.draw(3); p.end();
    }
    device.queue.submit([enc.finish()]);

    if(animating || hovering || introPlaying) rafId = requestAnimationFrame(render);
    else lastT = 0;
  }
  const wake = () => { if(!disposed && !rafId) rafId = requestAnimationFrame(render); };

  function resize(){
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if(w === W && h === H && sceneT) return;
    canvas.width = w; canvas.height = h;
    buildTargets(w, h);
    buildGrid();
    drawMask();
    wake();
  }

  addEventListener("pointermove", e => {
    if(!SW.interactive) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const inside = x >= 0 && y >= 0 && x <= r.width && y <= r.height;
    if(inside){
      const now = performance.now();
      const el = pointer.inside ? Math.max(8, now - pointer.at) : 16;
      const tr = pointer.inside ? Math.hypot(x - pointer.x, y - pointer.y) : 0;
      splash(x, y, Math.min(1, 0.22 + (tr / el) * 1000 * 0.0006) * SW.splashStrength);
      wake();
    }
    pointer.x = x; pointer.y = y; pointer.at = performance.now(); pointer.inside = inside;
  }, { passive: true });
  addEventListener("resize", () => { clearTimeout(initShapeWaves._rt); initShapeWaves._rt = setTimeout(resize, 200); });
  document.addEventListener("visibilitychange", wake);

  resize();
  if(SW.intro && !reduceMotion.matches){ introAt = performance.now(); introProgress = 0; }
  wake();

  return { dispose(){ disposed = true; if(rafId) cancelAnimationFrame(rafId); sceneT?.tex.destroy(); glowAT?.tex.destroy(); glowBT?.tex.destroy(); chargesBuf?.destroy(); } };
}

/* ---------------- 逐字出场（SplitText 的原生重写） ----------------
   把一行字拆成单字，逐字错峰升起：中文一字一个单位，
   数字和拉丁字母整词包一层（不把 1950 拆成 19 / 50），空格照旧可以断行。
   单行的可以开裁切框，字从框底升出来；多行的不开，免得裁到第二行。 */
function splitEnter(el, opts){
  if(!el) return;
  const o = Object.assign({ start: 0, gap: 0.05, dur: 0.9, y: "0.5em", mask: false }, opts);
  const latin = /[A-Za-z0-9]/;
  const frag = document.createDocumentFragment();
  let i = 0;

  const unit = ch => {
    const s = document.createElement("span");
    s.className = "st-c";
    s.style.setProperty("--i", i++);
    s.textContent = ch;
    return s;
  };

  Array.prototype.forEach.call(el.childNodes, node => {
    if(node.nodeType === 1){
      frag.appendChild(node.cloneNode(true));   // <br> 之类原样留下
      return;
    }
    if(node.nodeType !== 3) return;
    const text = node.nodeValue;
    let k = 0;
    while(k < text.length){
      const ch = text[k];
      if(ch === " " || ch === "\n"){ frag.appendChild(document.createTextNode(" ")); k++; continue; }
      if(latin.test(ch)){
        let j = k;
        while(j < text.length && latin.test(text[j])) j++;
        const w = document.createElement("span");
        w.className = "st-w";
        for(const c of text.slice(k, j)) w.appendChild(unit(c));
        frag.appendChild(w);
        k = j;
        continue;
      }
      frag.appendChild(unit(ch));
      k++;
    }
  });

  el.classList.add("st");
  el.style.setProperty("--st-start", o.start + "s");
  el.style.setProperty("--st-gap", o.gap + "s");
  el.style.setProperty("--st-dur", o.dur + "s");
  el.style.setProperty("--st-y", o.y);
  el.innerHTML = "";
  if(o.mask){
    const line = document.createElement("span");
    line.className = "st-line";
    line.appendChild(frag);
    el.appendChild(line);
  }
  else el.appendChild(frag);
}

/* 首屏哪几句走这个出场：主标题、副题、正文。
   时间轴沿用建档序列的节拍（遮板 1.84s 落定，3.62s 收尾），
   所以三段的逐字动画都排在 1.92s–3.6s 之间跑完。 */
function splitCoverText(){
  splitEnter($(".subject"),   { start: 2.2,  gap: 0.025, dur: 0.85, y: "0.6em",  mask: true });
  splitEnter($(".cover-desc"),{ start: 2.36, gap: 0.013, dur: 0.66, y: "0.42em" });
}

/* ---------------- 首屏标题 · 粒子字（ParticleText 的原生重写） ----------------
   把「刻痕」采样成粒子：粒子从四周聚拢成字，之后微微呼吸，鼠标靠近会被推开。
   原组件依赖 React；这里用同一套采样与聚合算法原生实现。
   标题本体只留语义（文字透明），画面交给这层 canvas。 */
const PT = {
  text: "刻痕", size: 2.2, density: 3.5,
  color: "#EDE8DE", highlight: "#FFECD0",   // 纸白 → 首屏检版灯的暖光：都在亮部，压在暗场上才清楚
  scatter: 180, gather: 1500, stagger: 420,
  repel: 42, radius: 130, drift: 0.7,
  start: 1900                                   // 遮板 1.84s 落定，粒子紧接着聚拢
};
function initParticleTitle(){
  const h1 = $(".cover h1");
  if(!h1) return null;
  const canvas = document.createElement("canvas");
  canvas.className = "pt-canvas";
  canvas.setAttribute("aria-hidden", "true");
  h1.classList.add("pt-on");
  h1.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const soft = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1, parts = [], raf = 0, gathering = false, gStart = 0, build = 0;
  let started = false, skipped = false;
  const pointer = { on: false, x: 0, y: 0, sx: 0, sy: 0, hold: 0 };
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const hex = h => {
    const c = String(h || "").replace("#", "");
    return /^[0-9a-f]{6}$/i.test(c)
      ? { r:parseInt(c.slice(0,2),16), g:parseInt(c.slice(2,4),16), b:parseInt(c.slice(4,6),16) } : null;
  };
  const mix = (a, b, t) => ({ r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t) });
  const css = c => "rgb(" + c.r + "," + c.g + "," + c.b + ")";

  function startGather(fromScatter){
    if(!parts.length) return;
    const spread = soft ? 0 : PT.scatter;
    parts.forEach(p => {
      if(fromScatter){
        const a = p.seed * Math.PI * 2, d = spread * (0.35 + p.depth * 0.75);
        p.x = p.tx + Math.cos(a) * d + (p.depth - 0.5) * spread * 0.55;
        p.y = p.ty + Math.sin(a) * d + (p.seed - 0.5) * spread * 0.55;
      }
      p.sx = p.x; p.sy = p.y;
      p.delay = soft ? 0 : p.seed * PT.stagger;
    });
    gStart = performance.now();
    gathering = true;
    wake();
  }
  function settle(){                       // 跳过建档时直接落位
    parts.forEach(p => { p.x = p.tx; p.y = p.ty; p.sx = p.tx; p.sy = p.ty; p.delay = 0; });
    gathering = false;
    skipped = true;                        // 之后那次定时聚拢就别再跑，免得字先亮后暗
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    parts.forEach(draw);
    cancelAnimationFrame(raf); raf = 0;
  }
  function draw(p){
    ctx.fillStyle = p.color;
    if(p.size <= 2.1) ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 6.2832); ctx.fill(); }
  }
  function sample(){
    const id = ++build;
    const r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.floor(r.width)); H = Math.max(1, Math.floor(r.height));
    if(!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cs = getComputedStyle(h1);
    const family = cs.fontFamily || "serif";
    const weight = cs.fontWeight || 700;
    let size = parseFloat(cs.fontSize) || 120;
    let font = weight + " " + size + "px " + family;

    const off = document.createElement("canvas");
    const oc = off.getContext("2d", { willReadFrequently: true });
    if(!oc) return;
    oc.font = font;
    let m = oc.measureText(PT.text);
    const maxW = W * 0.94;
    if(m.width > maxW){                    // 字比框宽就等比缩一点，保证整词都在
      size = Math.max(18, size * (maxW / m.width));
      font = weight + " " + size + "px " + family;
      oc.font = font; m = oc.measureText(PT.text);
    }
    if(id !== build) return;

    const left = Math.ceil(m.actualBoundingBoxLeft || 0);
    const right = Math.ceil(m.actualBoundingBoxRight || m.width);
    const asc = Math.ceil(m.actualBoundingBoxAscent || size * 0.78);
    const desc = Math.ceil(m.actualBoundingBoxDescent || size * 0.22);
    const pad = Math.max(12, Math.ceil(size * 0.08));
    off.width = left + right + pad * 2;
    off.height = asc + desc + pad * 2;
    oc.clearRect(0, 0, off.width, off.height);
    oc.font = font; oc.textAlign = "left"; oc.textBaseline = "alphabetic";
    oc.fillStyle = "#fff";
    oc.fillText(PT.text, pad - left, pad + asc);

    const data = oc.getImageData(0, 0, off.width, off.height).data;
    const targets = [];
    const step = Math.max(2, Math.floor(PT.density));
    for(let y = 0; y < off.height; y += step){
      for(let x = 0; x < off.width; x += step){
        const a = data[(y * off.width + x) * 4 + 3];
        if(a > 40) targets.push({
          x: W / 2 - off.width / 2 + x,
          y: H / 2 - off.height / 2 + y,
          a: a / 255
        });
      }
    }
    const cap = Math.max(900, Math.min(5200, Math.floor(W * H / 90)));
    const stride = Math.max(1, Math.ceil(targets.length / cap));
    const base = hex(PT.color), hi = hex(PT.highlight);
    parts = targets.filter((_, i) => i % stride === 0).map((t, i) => {
      const seed = ((i * 9301 + 49297) % 233280) / 233280;
      const depth = 0.45 + (((i * 233 + 97) % 1000) / 1000) * 0.9;
      const blend = base && hi ? clamp01(t.x / W + (seed - 0.5) * 0.35) : 0;
      const ang = seed * Math.PI * 2;
      const dist = (soft ? 0 : PT.scatter) * (0.35 + depth * 0.75);
      const sx = t.x + Math.cos(ang) * dist + (seed - 0.5) * PT.scatter * 0.45;
      const sy = t.y + Math.sin(ang) * dist + (depth - 0.9) * PT.scatter * 0.45;
      return {
        x: soft ? t.x : sx, y: soft ? t.y : sy, sx, sy, tx: t.x, ty: t.y,
        size: Math.max(0.6, PT.size * (0.75 + t.a * 0.45)),
        color: base && hi ? css(mix(base, hi, blend)) : PT.color,
        seed, depth, delay: seed * PT.stagger
      };
    });
    pointer.x = pointer.sx = W / 2;
    pointer.y = pointer.sy = H / 2;
    if(soft) settle();
    else if(started) startGather(false);      // 之后的每次重采样都重新聚拢
    // 第一次聚拢由挂载时的定时器统一触发，免得 ResizeObserver 的首次回调把它提前
  }

  function frame(now){
    raf = 0;
    ctx.clearRect(0, 0, W, H);
    pointer.sx += (pointer.x - pointer.sx) * 0.18;
    pointer.sy += (pointer.y - pointer.sy) * 0.18;
    let settled = true;
    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      let bx = p.tx, by = p.ty, progress = 1;
      if(gathering){
        progress = clamp01((now - gStart - p.delay) / (soft ? 1 : PT.gather));
        const e = easeOutCubic(progress);
        bx = p.sx + (p.tx - p.sx) * e;
        by = p.sy + (p.ty - p.sy) * e;
        if(progress < 1) settled = false;
      } else if(!soft && PT.drift > 0){
        const t = now * 0.001;
        bx += Math.sin(t * 0.9 + p.seed * 10) * PT.drift * p.depth;
        by += Math.cos(t * 0.75 + p.depth * 10) * PT.drift * p.depth;
      }
      if(pointer.on && !soft && PT.repel > 0){
        const dx = bx - pointer.sx, dy = by - pointer.sy, d = Math.hypot(dx, dy);
        if(d > 0 && d < PT.radius){
          const f = Math.pow(1 - d / PT.radius, 2) * PT.repel;
          bx += (dx / d) * f; by += (dy / d) * f;
        }
      }
      const follow = soft ? 1 : 0.22;
      p.x += (bx - p.x) * follow;
      p.y += (by - p.y) * follow;
      ctx.globalAlpha = clamp01(0.35 + progress * 0.65);
      draw(p);
    }
    ctx.globalAlpha = 1;
    if(gathering && settled) gathering = false;
    /* 成形后不再逐帧跑；鼠标在标题上时继续跑，离开后再多跑一会儿让粒子回落 */
    if(gathering || now < pointer.hold) raf = requestAnimationFrame(frame);
  }
  function wake(){ if(!raf && !document.hidden) raf = requestAnimationFrame(frame); }
  function aim(e){
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top;
    pointer.on = true;
    pointer.hold = performance.now() + 420;
    wake();
  }

  canvas.addEventListener("pointermove", aim);
  canvas.addEventListener("pointerenter", aim);
  canvas.addEventListener("pointerleave", () => {
    pointer.on = false;
    pointer.hold = performance.now() + 420;
    wake();
  });
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ cancelAnimationFrame(raf); raf = 0; }
    else if(gathering) wake();
  });
  new ResizeObserver(() => { clearTimeout(sample._t); sample._t = setTimeout(sample, 160); })
    .observe(canvas.parentElement);

  requestAnimationFrame(sample);
  if(!soft) setTimeout(() => { if(skipped) return; started = true; startGather(false); }, PT.start);
  return { settle, wake, sample };
}

/* ---------------- 进场弹弓（SlingButton 的原生重写） ----------------
   按住圆片往外拉：皮筋按 rubberband 拉长（有上限），过了 armAt 算"上弦"，
   蓄力弧走满；松手把它按拉力和甩手的合成速度弹回去，并撒一串粒子。
   轻点/回车直接进场，拖拽中按 Esc 取消。 */
function initSling(host, onSend){
  if(!host) return null;
  const S = { size:40, stroke:2.5, armAt:36, maxPull:120, launch:2600, recoil:.2,
              flight:96, particles:12, spread:60, icon:16 };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const R = S.maxPull, ARM = Math.min(S.armAt, .8 * R), GAP = 4;
  const wellR = S.size / 2 + GAP + S.stroke;
  const padR = S.size / 2 - S.stroke / 2;
  const H = wellR + S.stroke + 2;
  const DOT = Math.max(5, Math.round(S.size / 7));
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

  /* 尺寸只在 JS 这一处定，CSS 变量由它下发，免得两边写两份对不上 */
  host.style.setProperty("--sl-size", S.size + "px");
  host.style.setProperty("--sl-svg", (2 * H) + "px");
  host.style.setProperty("--sl-stroke", S.stroke + "px");
  host.style.setProperty("--sl-dot", DOT + "px");
  host.style.setProperty("--sl-icon-size", S.icon + "px");

  host.innerHTML =
    '<svg class="sling-fx" viewBox="' + (-H) + " " + (-H) + " " + (2*H) + " " + (2*H) + '" aria-hidden="true">' +
      '<g class="sling-tension" style="opacity:0">' +
        '<path class="sling-band"></path><path class="sling-band sling-band--hot"></path>' +
      '</g>' +
      '<circle class="sling-well" r="' + wellR + '"></circle>' +
      '<circle class="sling-arc" r="' + wellR + '" pathLength="1" stroke-dasharray="0 1" style="opacity:0"></circle>' +
    '</svg>' +
    Array.from({ length: S.particles }, () => '<span class="sling-dot" aria-hidden="true"></span>').join("") +
    '<span class="sling-move"><button type="button" class="sling-pad" aria-label="进入展项">' +
      '<span class="sling-face"><span class="sling-icon">' + ARROW + '</span></span>' +
    '</button></span>' +
    '<span class="sling-sr">回车或轻点即可进入，也可以拉住圆片往外甩。</span>';

  const tension = $(".sling-tension", host), arc = $(".sling-arc", host);
  const bands = $$(".sling-band", host), band = bands[0], hot = bands[1];
  const move = $(".sling-move", host), pad = $(".sling-pad", host), icon = $(".sling-icon", host);
  const dots = $$(".sling-dot", host);

  let x = 0, y = 0, dirX = 0, dirY = -1, grip = null, armed = false, power = 0;
  let raf = 0, skipClick = false, dotT = 0, sentT = 0;

  function place(){ move.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)"; }
  function relax(){
    icon.style.transition = reduce ? "none" : "transform 360ms cubic-bezier(.23,1,.32,1)";
    icon.style.transform = "rotate(0deg)";
  }
  function paint(){
    const proj = x * dirX + y * dirY;
    const p = clamp01(proj / ARM);
    const dist = Math.hypot(x, y);
    let d = "";
    if(dist > .5){
      const a = Math.atan2(y, x);
      const b = Math.acos(Math.max(-1, Math.min(1, (wellR - padR) / dist)));
      d = [a + b, a - b].map(t => {
        const cx = Math.cos(t), cy = Math.sin(t);
        return "M" + (wellR * cx).toFixed(2) + "," + (wellR * cy).toFixed(2) +
          "L" + (x + padR * cx).toFixed(2) + "," + (y + padR * cy).toFixed(2);
      }).join("");
    }
    band.setAttribute("d", d); hot.setAttribute("d", d);
    hot.style.opacity = String(p);
    tension.style.opacity = String(clamp01(proj / 6));
    arc.setAttribute("stroke-dasharray", p + " " + (1 - p));
    arc.setAttribute("stroke-dashoffset", String(p / 2));
    arc.style.opacity = p > .01 ? "1" : "0";
    const deg = Math.atan2(-dirY, -dirX) * 180 / Math.PI;
    arc.setAttribute("transform", "rotate(" + deg + ")");
    icon.style.transform = "rotate(" + (deg + 90) * clamp01(dist / 12) + "deg)";
  }
  function flash(){
    host.setAttribute("data-sent", "");
    clearTimeout(sentT);
    sentT = setTimeout(() => host.removeAttribute("data-sent"), 200);
  }
  function launchDots(){
    const base = Math.atan2(-dirY, -dirX);
    const cone = S.spread * Math.PI / 180;
    const push = .85 + .35 * power;
    dots.forEach((dot, i) => {
      const lead = i === 0;
      const ang = base + (lead ? 0 : (Math.random() + Math.random() - 1) * (cone / 2));
      const cx = Math.cos(ang), cy = Math.sin(ang);
      const reach = (lead ? S.flight : S.flight * (.3 + Math.random())) * push;
      const drift = lead ? 0 : (Math.random() - .5) * S.flight * .4;
      const scale = lead ? 1 : .3 + Math.random() * .6;
      const shrink = lead ? .6 : scale * (.2 + Math.random() * .4);
      const dur = lead ? 300 : 300 * (.7 + Math.random());
      const delay = lead ? 0 : Math.random() * 70;
      const to = wellR + reach;
      const from = "translate(" + (cx * wellR).toFixed(1) + "px," + (cy * wellR).toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";
      const end = "translate(" + (cx * to - cy * drift).toFixed(1) + "px," + (cy * to + cx * drift).toFixed(1) + "px) scale(" + shrink.toFixed(2) + ")";
      dot.animate(
        [{ transform: from, opacity: 1 }, { transform: end, opacity: 1, offset: .55 }, { transform: end, opacity: 0 }],
        { duration: dur, delay, easing: "cubic-bezier(.23,1,.32,1)", fill: "none" }
      );
    });
  }
  function send(){ if(typeof onSend === "function") onSend(); }
  function settleSpring(v0x, v0y){
    cancelAnimationFrame(raf);
    if(reduce){
      const t = $(".sling-tension", host);
      t.style.transition = "opacity 200ms ease"; t.style.opacity = "0";
      setTimeout(() => { x = y = 0; place(); paint(); t.style.transition = ""; }, 200);
      return;
    }
    const w = 2 * Math.PI / .4, z = Math.max(.15, 1 - S.recoil);
    const K = w * w, C = 2 * z * w;
    let vX = v0x, vY = v0y, last = 0;
    const step = now => {
      raf = 0;
      const dt = last ? Math.min((now - last) / 1000, .05) : 1 / 60;
      last = now;
      vX += (K * (0 - x) - C * vX) * dt;
      vY += (K * (0 - y) - C * vY) * dt;
      x += vX * dt; y += vY * dt;
      if(Math.abs(x) < .3 && Math.abs(y) < .3 && Math.hypot(vX, vY) < 10){ x = 0; y = 0; }
      place(); paint();
      if(x || y) raf = requestAnimationFrame(step);
      else { last = 0; relax(); }
    };
    raf = requestAnimationFrame(step);
  }
  function release(pid, cancelled){
    if(!grip || grip.id !== pid) return;
    const g = grip; grip = null; skipClick = true;
    try{ pad.releasePointerCapture(pid); }catch(err){}
    pad.removeAttribute("data-held");
    const d = Math.hypot(x, y), p = d / ARM;
    let vx0 = 0, vy0 = 0;
    if(!cancelled && g.hist.length > 1){
      const a = g.hist[0], b = g.hist[g.hist.length - 1], dt = b.t - a.t;
      if(dt > 0 && performance.now() - b.t < 50){ vx0 = (b.x - a.x) / dt * 1000; vy0 = (b.y - a.y) / dt * 1000; }
    }
    const fm = Math.hypot(vx0, vy0);
    if(fm > 3000){ vx0 *= 3000 / fm; vy0 *= 3000 / fm; }

    if(!g.moved){
      relax();
      if(!cancelled) send();
    } else {
      const fire = armed && !cancelled;
      const pull = fire ? S.launch * Math.min(p, 1.5) : .5 * S.launch * Math.min(p, 1);
      let v0x = vx0 - dirX * pull, v0y = vy0 - dirY * pull;
      const m = Math.hypot(v0x, v0y);
      if(m > 6000){ v0x *= 6000 / m; v0y *= 6000 / m; }
      if(!fire) relax();
      if(fire){
        send();
        if(reduce) flash();
        else {
          power = clamp01((Math.min(p, 1.5) - 1) / .5);
          clearTimeout(dotT);
          dotT = setTimeout(launchDots, 150);
        }
      }
      settleSpring(v0x, v0y);
    }
    armed = false;
    host.removeAttribute("data-armed");
  }

  pad.addEventListener("pointerdown", e => {
    if(grip || e.button !== 0) return;
    const rect = host.getBoundingClientRect();
    const scale = rect.width / (host.offsetWidth || rect.width) || 1;
    cancelAnimationFrame(raf); raf = 0;
    const dNow = Math.hypot(x, y), dCl = Math.min(dNow, .95 * R);
    const rawNow = dNow > .5 ? (R * dCl) / (R - dCl) : 0;
    grip = {
      id:e.pointerId, sx:e.clientX, sy:e.clientY, scale, moved:false, hist:[],
      rox: dNow > .5 ? rawNow * x / dNow : 0,
      roy: dNow > .5 ? rawNow * y / dNow : 0,
      slop: e.pointerType === "touch" ? 8 : 4
    };
    try{ pad.setPointerCapture(e.pointerId); }catch(err){}
    pad.setAttribute("data-held", "");
    icon.style.transition = "none";
  });
  pad.addEventListener("pointermove", e => {
    if(!grip || grip.id !== e.pointerId) return;
    const dx = (e.clientX - grip.sx) / grip.scale, dy = (e.clientY - grip.sy) / grip.scale;
    const rx = grip.rox + dx, ry = grip.roy + dy;
    if(!grip.moved && Math.hypot(dx, dy) > grip.slop) grip.moved = true;
    const raw = Math.hypot(rx, ry);
    if(raw < .01) return;
    const d = (R * raw) / (R + raw);          // 橡皮筋：越拉越沉，但有上限
    dirX = rx / raw; dirY = ry / raw;
    x = d * dirX; y = d * dirY;
    const t = performance.now();
    grip.hist.push({ x, y, t });
    while(grip.hist.length > 4 || t - grip.hist[0].t > 80) grip.hist.shift();
    const on = d >= ARM;
    if(on !== armed){
      armed = on;
      if(on) host.setAttribute("data-armed", ""); else host.removeAttribute("data-armed");
    }
    place(); paint();
  });
  pad.addEventListener("pointerup", e => release(e.pointerId, false));
  pad.addEventListener("pointercancel", e => release(e.pointerId, true));
  pad.addEventListener("lostpointercapture", e => release(e.pointerId, true));
  pad.addEventListener("keydown", e => {
    if(e.key === "Escape" && grip) release(grip.id, true);
  });
  pad.addEventListener("click", () => {
    if(skipClick){ skipClick = false; return; }
    send();
  });

  place(); paint();
  return { send };
}

/* ---------------- 首屏建档序列 ---------------- */
let introTimers = [];
function finishIntro(){

  const cover = $("#cover");
  if(cover.classList.contains("ready")) return;
  cover.classList.remove("playing");

/* ---------------- 首屏 · 网点显影（HalftoneReveal 的 canvas 实现） ----------------
   参数照给定组件：mono / line / cellSize 5 / angle 30 /
   ink #FFBC20 / paper #000000 / revealRadius 160。
   单文件静态页没有 React 构建流程，所以原样用 canvas 实现，不引入依赖。 */
const HT = {
  src: "garden-gpt-image-2/image/01-hero-grassland.png",
  wood: "garden-gpt-image-2/image/08-wood-block.png",
  cellSize: 5,
  angle: 30,
  ink: "#EFEAE0",
  paper: "#14110E",
  revealRadius: 160,
  artifacts: true
};
let ht = null;

/* 印刷痕迹：把手里的图往"手印版画"上拉，消掉数字稿的塑料感。
   五道叠加——套色偏移、木纹透印、墨色不匀、纸纹颗粒、边缘走墨浅。
   种子固定，同一尺寸下每次重绘的纹理完全一致。 */
function printPass(sx, DW, DH, dpr, wood){
  let s = 20261014;
  const rand = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;

  /* 1. 套色偏移：同一张版错开一点点再压一次。
     用 darken / lighten 各压一层，只在轮廓边上留下一边深一边浅的错位，
     平网处两张完全相同、互不改变——不会把整张压暗。 */
  const ghost = document.createElement("canvas");
  ghost.width = DW; ghost.height = DH;
  ghost.getContext("2d").drawImage(sx.canvas, 0, 0);
  const ox = Math.round(2.2 * dpr), oy = Math.round(-1.5 * dpr);
  sx.globalCompositeOperation = "darken";
  sx.globalAlpha = 0.34;
  sx.drawImage(ghost, ox, oy);
  sx.globalCompositeOperation = "lighten";
  sx.globalAlpha = 0.2;
  sx.drawImage(ghost, ox, oy);
  sx.globalAlpha = 1;
  sx.globalCompositeOperation = "source-over";

  /* 2. 木纹透印：把木板纹理压成低频、均值归中，只透出木头的走向，
     不带来它自己的深浅——overlay 一层中性灰，不改变整体调子。 */
  if(wood){
    try{
      const N = 72;
      const g = document.createElement("canvas");
      g.width = g.height = N;
      const gx = g.getContext("2d");
      gx.drawImage(wood, 0, 0, N, N);
      const id = gx.getImageData(0, 0, N, N);
      const lum = new Float32Array(N * N);
      let sum = 0;
      for(let i = 0, p = 0; i < id.data.length; i += 4, p++){
        lum[p] = 0.299 * id.data[i] + 0.587 * id.data[i + 1] + 0.114 * id.data[i + 2];
        sum += lum[p];
      }
      const mean = sum / lum.length;
      for(let i = 0, p = 0; i < id.data.length; i += 4, p++){
        const v = Math.max(0, Math.min(255, 128 + (lum[p] - mean) * 1.5));
        id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
        id.data[i + 3] = 255;
      }
      gx.putImageData(id, 0, 0);
      sx.globalCompositeOperation = "overlay";
      sx.globalAlpha = 0.12;
      sx.drawImage(g, 0, 0, DW, DH);
      sx.globalAlpha = 1;
      sx.globalCompositeOperation = "source-over";
    }catch(err){
      console.warn("[刻痕] 木纹层跳过：", err && err.message);
    }
  }

  /* 3. 墨色不匀：手工上墨的厚薄。
     先在低频灰场上画深浅斑块，再一次性 soft-light 压上去——
     只制造起伏，不整体压暗（逐个 multiply 叠加会把版画压灰压平）。 */
  const ink = document.createElement("canvas");
  ink.width = 320; ink.height = 200;
  const ix = ink.getContext("2d");
  ix.fillStyle = "#808080"; ix.fillRect(0, 0, ink.width, ink.height);
  for(let i = 0; i < 90; i++){
    const x = rand() * ink.width, y = rand() * ink.height, r = 18 + rand() * 70;
    const g = ix.createRadialGradient(x, y, 0, x, y, r);
    const dark = rand() < 0.5;
    g.addColorStop(0, dark ? "rgba(74,74,74,0.5)" : "rgba(182,182,182,0.5)");
    g.addColorStop(1, "rgba(128,128,128,0)");
    ix.fillStyle = g;
    ix.fillRect(x - r, y - r, r * 2, r * 2);
  }
  sx.globalCompositeOperation = "soft-light";
  sx.globalAlpha = 0.5;
  sx.drawImage(ink, 0, 0, DW, DH);
  sx.globalAlpha = 1;
  sx.globalCompositeOperation = "source-over";

  /* 4. 纸纹颗粒 */
  const tile = document.createElement("canvas");
  tile.width = tile.height = 256;
  const tc = tile.getContext("2d");
  const noise = tc.createImageData(256, 256);
  for(let i = 0; i < noise.data.length; i += 4){
    const v = 128 + (rand() - 0.5) * 88;
    noise.data[i] = noise.data[i + 1] = noise.data[i + 2] = v;
    noise.data[i + 3] = 255;
  }
  tc.putImageData(noise, 0, 0);
  sx.globalCompositeOperation = "overlay";
  sx.globalAlpha = 0.1;
  sx.fillStyle = sx.createPattern(tile, "repeat");
  sx.fillRect(0, 0, DW, DH);
  sx.globalAlpha = 1;
  sx.globalCompositeOperation = "source-over";

  /* 5. 边缘墨不到：四边走墨浅，往纸色提一点 */
  const rg = sx.createRadialGradient(
    DW * 0.48, DH * 0.46, Math.min(DW, DH) * 0.42,
    DW * 0.5, DH * 0.5, Math.max(DW, DH) * 0.74);
  rg.addColorStop(0, "rgba(239,234,224,0)");
  rg.addColorStop(1, "rgba(239,234,224,0.1)");
  sx.globalCompositeOperation = "screen";
  sx.fillStyle = rg;
  sx.fillRect(0, 0, DW, DH);
  sx.globalCompositeOperation = "source-over";
}

/* 首屏：印刷痕迹直接做在那张木刻原图上。
   原图先照常显示，带痕迹的画布就位后再盖上去——痕迹没跑成时页面也不闪白。
   画布必须插在 ShapeWaves 之前，否则会把这层效果压掉。 */
function initHeroPrint(){
  const media = document.querySelector(".cover-media");
  const img = document.getElementById("heroImg");
  if(!media || !img) return;

  let hero = null, wood = null, ready = false;
  const cv = document.createElement("canvas");
  cv.className = "cover-img cover-print";
  cv.setAttribute("aria-hidden", "true");

  const loadImg = src => new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });

  Promise.all([loadImg(img.getAttribute("src")), loadImg(IMG + "08-wood-block.png")])
    .then(([h, w]) => {
      hero = h; wood = w;
      if(!hero){ console.warn("[刻痕] 首屏原图加载失败，印刷痕迹已跳过"); return; }
      build();
      let rt;
      addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 200); });
    });

  function build(){
    if(!hero) return;
    /* 用 clientWidth 而不是 getBoundingClientRect：外层有 scale + 视差位移，
       这里要的是布局尺寸，画完再交给 CSS 变换。 */
    const W = Math.max(320, media.clientWidth || 320);
    const H = Math.max(320, media.clientHeight || 320);
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    const DW = Math.round(W * dpr), DH = Math.round(H * dpr);
    cv.width = DW; cv.height = DH;

    const sx = cv.getContext("2d");
    sx.setTransform(1, 0, 0, 1, 0, 0);
    sx.globalAlpha = 1;
    sx.globalCompositeOperation = "source-over";
    sx.clearRect(0, 0, DW, DH);

    /* 与原图的 object-fit:cover / object-position:center 42% 对齐 */
    const k = Math.max(DW / hero.width, DH / hero.height);
    const dw = hero.width * k, dh = hero.height * k;
    sx.drawImage(hero, (DW - dw) / 2, (DH - dh) * 0.42, dw, dh);

    printPass(sx, DW, DH, dpr, wood);

    if(!ready){
      ready = true;
      const sw = document.getElementById("swCanvas");
      if(sw) media.insertBefore(cv, sw); else media.appendChild(cv);
      img.classList.add("cover-img-src");
    }
  }
}

function initHalftone(){
  const cv = document.getElementById("htCanvas"); if(!cv) return null;
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1, DW = 0, DH = 0;
  let srcC = null, htC = null, rlC = null, rlx = null, img = null;
  let tgtX = 0, tgtY = 0, curX = 0, curY = 0, lastMove = -1e9;

  let woodImg = null;
  const loadImg = src => new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
  Promise.all([loadImg(HT.src), loadImg(HT.wood)]).then(([hero, wood]) => {
    img = hero; woodImg = wood;
    if(!img){ console.warn("[刻痕] 首屏图片加载失败，网点显影已停用"); return; }
    build();
  });

  function build(){
    if(!img) return;
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.max(320, Math.round(r.width));
    H = Math.max(320, Math.round(r.height));
    DW = Math.round(W * dpr); DH = Math.round(H * dpr);
    cv.width = DW; cv.height = DH;
    cv.classList.remove("on");

    /* 源图按 cover 铺满，落到设备像素的离屏画布 */
    const s = document.createElement("canvas"); s.width = DW; s.height = DH;
    const sx = s.getContext("2d");
    const scale = Math.max(DW / img.width, DH / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    sx.drawImage(img, (DW - dw) / 2, (DH - dh) / 2, dw, dh);
    srcC = s;
    if(HT.artifacts) printPass(sx, DW, DH, dpr, woodImg);

    let data;
    try{
      /* 读像素是整段里唯一可能被安全策略拦下的一步：
         用 file:// 双击打开时画布会被判为跨域污染，这里会抛 SecurityError。 */
      data = sx.getImageData(0, 0, DW, DH).data;
    }catch(err){
      console.warn("[刻痕] 读不到画布像素，网点显影停用，首屏回落到原图：", err && err.message);
      htC = null;
      return;
    }

    /* 网点层：逐格取样，按暗度画一根与 angle 同向的短线。
       所有短线合进同一条 path，最后只 stroke 一次——否则几万次 stroke 会卡死主线程。 */
    const t = document.createElement("canvas"); t.width = DW; t.height = DH;
    const tx = t.getContext("2d");
    tx.fillStyle = HT.paper; tx.fillRect(0, 0, DW, DH);
    tx.strokeStyle = HT.ink; tx.lineCap = "round";
    const cs = HT.cellSize * dpr;
    const rad = HT.angle * Math.PI / 180, dx = Math.cos(rad), dy = Math.sin(rad);
    tx.lineWidth = Math.max(0.6, cs * 0.4);
    tx.beginPath();
    for(let gy = 0; gy < DH; gy += cs){
      const py = Math.min(DH - 1, gy + cs / 2);
      for(let gx = 0; gx < DW; gx += cs){
        const px = Math.min(DW - 1, gx + cs / 2);
        const o = ((py | 0) * DW + (px | 0)) * 4;
        const lum = (data[o] * 0.299 + data[o + 1] * 0.587 + data[o + 2] * 0.114) / 255;
        const k = 1 - lum;
        if(k <= 0.05) continue;
        const half = k * cs * 1.35 / 2;
        tx.moveTo(px - dx * half, py - dy * half);
        tx.lineTo(px + dx * half, py + dy * half);
      }
    }
    tx.stroke();
    htC = t;
    /* 显影层：独立画布，用来做羽化遮罩 */
    if(!rlC || rlC.width !== DW || rlC.height !== DH){
      rlC = document.createElement("canvas"); rlC.width = DW; rlC.height = DH;
      rlx = rlC.getContext("2d");
    }
    curX = tgtX = W / 2; curY = tgtY = H * 0.45;
    frame(performance.now(), 16);
    cv.classList.add("on");
  }

  function frame(ts, dt){
    if(!htC) return;
    if((ts - lastMove) > 2600 && !reduceMotion){
      /* 没有指针时自己巡移，触屏与静置也有东西可看 */
      tgtX = W * (0.34 + 0.22 * Math.sin(ts * 0.000062));
      tgtY = H * (0.46 + 0.18 * Math.cos(ts * 0.000047));
    }
    const ease = reduceMotion ? 1 : 1 - Math.pow(0.0022, dt / 1000);
    curX += (tgtX - curX) * ease;
    curY += (tgtY - curY) * ease;

    const cx = curX * dpr, cy = curY * dpr, rr = HT.revealRadius * dpr;

    /* 显影层：原图 + 径向羽化遮罩（越靠边越透明，没有硬边） */
    rlx.setTransform(1, 0, 0, 1, 0, 0);
    rlx.globalCompositeOperation = "source-over";
    rlx.clearRect(0, 0, DW, DH);
    rlx.drawImage(srcC, 0, 0);
    const g = rlx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.55, "rgba(0,0,0,1)");
    g.addColorStop(0.74, "rgba(0,0,0,0.5)");
    g.addColorStop(0.9, "rgba(0,0,0,0.16)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    rlx.globalCompositeOperation = "destination-in";
    rlx.fillStyle = g;
    rlx.fillRect(0, 0, DW, DH);
    rlx.globalCompositeOperation = "source-over";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, DW, DH);
    ctx.drawImage(htC, 0, 0);
    ctx.drawImage(rlC, 0, 0);
  }

  addEventListener("pointermove", e => {
    const r = cv.getBoundingClientRect();
    tgtX = e.clientX - r.left; tgtY = e.clientY - r.top;
    lastMove = performance.now();
  }, { passive: true });

  addEventListener("resize", () => {
    clearTimeout(initHalftone._rt);
    initHalftone._rt = setTimeout(build, 200);
  });

  return { frame, build };
}

/* ---------------- 背景动效 · 夜里还在运转的印刷间 ----------------
   三层：检版灯（跟随指针 / 自动巡移）、木板上缓缓长出的刻痕、空气里的浮尘。
   刻痕只长在全站底上，首屏主图之上只留浮尘与墨粉，免得划伤画面。 */
function materialEngine(cv, withStrokes){
  if(!cv) return null;
  let ctx, W, H, dpr, grains = [], motes = [], strokes = [], nextStroke = 1400;
  function build(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = Math.max(320, Math.round(r.width)); H = Math.max(320, Math.round(r.height));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    grains = [];
    const n = Math.round((W * H) / 1600);
    for(let i = 0; i < n; i++){
      grains.push({ x: Math.random() * W, y: Math.random() * H,
        r: 0.3 + Math.random() * 1, ph: Math.random() * 6.2832, sp: 0.4 + Math.random() * 1.6 });
    }
    motes = [];
    const mn = Math.max(8, Math.round(W / 110));
    for(let i = 0; i < mn; i++){
      motes.push({ x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 4, vy: -1.5 - Math.random() * 4,
        r: 0.6 + Math.random() * 1.4, a: 0.05 + Math.random() * 0.13, ph: Math.random() * 6.2832 });
    }
    strokes = [];
  }
  function spawn(){
    const pts = [{ x: Math.random() * W, y: Math.random() * H * 0.94 }];
    let ang = (Math.random() - 0.5) * 1;
    const seg = 3 + Math.floor(Math.random() * 3);
    for(let i = 1; i < seg; i++){
      ang += (Math.random() - 0.5) * 0.8;
      const len = 26 + Math.random() * 58;
      pts.push({ x: pts[i-1].x + Math.cos(ang) * len, y: pts[i-1].y + Math.sin(ang) * len });
    }
    strokes.push({ pts, life: 0, dur: 8000 + Math.random() * 6000, w: 0.7 + Math.random() * 1.3 });
    if(strokes.length > 3) strokes.shift();
  }
  function paint(t, dt){
    if(!ctx) return;
    ctx.clearRect(0, 0, W, H);
    /* 墨粉：密度不均，极慢的呼吸式明灭 */
    ctx.fillStyle = "#EDE8DE";
    for(let i = 0; i < grains.length; i++){
      const d = grains[i];
      const b = 0.5 + 0.5 * Math.sin(t * 0.00019 * d.sp + d.ph);
      ctx.globalAlpha = 0.022 + b * 0.075;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.fill();
    }
    /* 刻痕：缓缓走刀，停一会儿再淡去 */
    if(withStrokes){
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#EDE8DE";
      for(let i = 0; i < strokes.length; i++){
        const s = strokes[i];
        s.life += dt;
        const p = s.life / s.dur;
        if(p >= 1) continue;
        const k = Math.min(1, p / 0.55);
        const a = p < 0.14 ? p / 0.14 : (p > 0.72 ? (1 - p) / 0.28 : 1);
        let total = 0; const seg = [];
        for(let j = 1; j < s.pts.length; j++){
          const L = Math.hypot(s.pts[j].x - s.pts[j-1].x, s.pts[j].y - s.pts[j-1].y);
          seg.push(L); total += L;
        }
        const target = k * total;
        ctx.globalAlpha = a * 0.13;
        ctx.lineWidth = s.w;
        ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
        let acc = 0;
        for(let j = 1; j < s.pts.length; j++){
          const L = seg[j-1];
          if(acc + L <= target){ ctx.lineTo(s.pts[j].x, s.pts[j].y); acc += L; }
          else {
            const f = (target - acc) / L;
            ctx.lineTo(s.pts[j-1].x + (s.pts[j].x - s.pts[j-1].x) * f,
                       s.pts[j-1].y + (s.pts[j].y - s.pts[j-1].y) * f);
            break;
          }
        }
        ctx.stroke();
      }
      strokes = strokes.filter(s => s.life / s.dur < 1);
    }
    /* 浮尘 */
    for(let i = 0; i < motes.length; i++){
      const m = motes[i];
      m.x += m.vx * dt / 1000; m.y += m.vy * dt / 1000;
      if(m.y < -12){ m.y = H + 12; m.x = Math.random() * W; }
      if(m.x < -12) m.x = W + 12; else if(m.x > W + 12) m.x = -12;
      ctx.globalAlpha = m.a * (0.45 + 0.55 * Math.sin(t * 0.0007 + m.ph));
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  build();
  return {
    build, paint,
    tick(t, dt){
      if(withStrokes && !reduceMotion && t > nextStroke){
        spawn();
        nextStroke = t + 7000 + Math.random() * 6000;
      }
    }
  };
}

let matGlobal = null, matCover = null, activeMat = null, loopRaf = 0, lastTs = 0;
let parX = 0, parY = 0, parTX = 0, parTY = 0, parPX = -999, parPY = -999;

function initBackground(){
  matGlobal = materialEngine($("#bgCanvas"), true);
  matCover = materialEngine($("#coverMat"), false);
  /* ShapeWaves 作为叠加层加在首屏背景之上：黑底 + screen 混合，只点亮字形。
     背景是那张木刻原图，这一层起不来也不影响任何东西。 */
  const swCanvas = document.getElementById("swCanvas");
  if(swCanvas){
    initShapeWaves(swCanvas).then(() => {
      swCanvas.classList.add("on");
    }).catch(err => {
      console.warn("[刻痕] ShapeWaves 叠加层未启动（背景不受影响）：", err && err.message);
    });
  }
  const root = document.documentElement;

  addEventListener("pointermove", e => {
    /* 主图视差：反向平移一点点，制造前后景的深度 */
    parTX = (e.clientX / innerWidth - 0.5) * -30;
    parTY = (e.clientY / innerHeight - 0.5) * -20;
  }, { passive: true });

  addEventListener("resize", () => {
    clearTimeout(initBackground._rt);
    initBackground._rt = setTimeout(() => {
      if(matGlobal) matGlobal.build();
      if(matCover) matCover.build();
    }, 200);
  });

  if(reduceMotion){
    if(matGlobal) matGlobal.paint(0, 16);
    if(matCover) matCover.paint(0, 16);
    return;
  }

  const loop = ts => {
    const dt = lastTs ? Math.min(80, ts - lastTs) : 16;
    lastTs = ts;
    const ease = 1 - Math.pow(0.0016, dt / 1000);
    parX += (parTX - parX) * ease;
    parY += (parTY - parY) * ease;
    if(Math.abs(parX - parPX) > 0.4 || Math.abs(parY - parPY) > 0.4){
      parPX = parX; parPY = parY;
      root.style.setProperty("--hx", parX.toFixed(1) + "px");
      root.style.setProperty("--hy", parY.toFixed(1) + "px");
    }
    if(activeMat){ activeMat.tick(ts, dt); activeMat.paint(ts, dt); }
    if(ht && activeMat === matCover) ht.frame(ts, dt);
    loopRaf = requestAnimationFrame(loop);
  };
  loopRaf = requestAnimationFrame(loop);

  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ cancelAnimationFrame(loopRaf); loopRaf = 0; }
    else if(!loopRaf){ lastTs = 0; loopRaf = requestAnimationFrame(loop); }
  });
}

/* ---------------- 进场推杆（WakeSlider 的原生重写） ----------------
   杆子随手走、但慢半步：位置走弹簧，抬起的幅度由速度决定，
   推得越快扬得越高。拖到底才算推开门，没到底松手就停在原地。 */
function initWakeSlider(){
  const root = $("#wake"), track = $("#wakeTrack"), knob = $("#wakeKnob"), num = $("#wakeNum");
  if(!root || !track || !knob) return null;

  const BARS = 30, MIN = 0, MAX = 100, STEP = 1;
  const CATCH = 0.95;              // 进到最后 5% 就算到底，拖到头不必像素级对齐
  const SETTLE = 9.23, FULL_SPEED = 320, MIN_REACH = 1.5, FLAT = 0.002;
  const REACH = 6, SKEW = 0.6, SENS = 1.5, GLIDE = 0.24, SMOOTH = 100, HOLD = 420;
  const KNOB = 20, REST = 11 / 46;
  const soft = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const bars = [], crests = [];
  const frag = document.createDocumentFragment();
  for(let i = 0; i < BARS; i++){
    const b = document.createElement("span");
    b.className = "wake-bar";
    const c = document.createElement("span");
    c.className = "wake-crest";
    b.appendChild(c);
    bars.push(b); crests.push(c);
    frag.appendChild(b);
  }
  track.insertBefore(frag, knob);

  let value = 0;                   // 已落位的值（整数）
  let target = 0;                  // 弹簧目标（百分比）
  let head = 0, vel = 0, spd = 0;  // 当前位置 / 速度 / 平滑后的速度
  let amp = 0, lastAmp = 0, raf = 0, lastTs = 0;
  let pid = null, dragging = false, entered = false, holdT = 0;

  const w0 = SETTLE / GLIDE, K = w0 * w0, C = 2 * w0;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smoothstep = s => s * s * (3 - 2 * s);

  function readout(){
    if(num) num.textContent = String(value).padStart(3, "0");
    track.setAttribute("aria-valuenow", String(value));
    track.setAttribute("aria-valuetext", value + " / 100");
  }
  function valueFromX(x){
    const r = track.getBoundingClientRect();
    if(!r.width) return value;
    const ratio = clamp01((x - r.left) / r.width);
    return ratio >= CATCH ? MAX : MIN + ratio * (MAX - MIN);
  }
  function go(){
    if(!raf) raf = requestAnimationFrame(frame);
  }
  function commit(next){
    const clean = Math.max(MIN, Math.min(MAX, Math.round(next / STEP) * STEP));
    if(clean !== value){ value = clean; readout(); }
    target = (value - MIN) / (MAX - MIN) * 100;
    if(value >= MAX){ if(dragging) armHold(); }
    else disarmHold();
    go();
  }
  function armHold(){
    if(holdT) return;
    /* 一直推着不松手也算——省得为了触发还得抬手指 */
    holdT = setTimeout(() => { holdT = 0; if(dragging && value >= MAX) enterHall(); }, soft ? 0 : HOLD);
  }
  function disarmHold(){
    if(holdT){ clearTimeout(holdT); holdT = 0; }
  }
  function enterHall(){
    if(entered) return;
    entered = true;
    disarmHold();
    root.classList.add("done");
    const beat = soft ? 0 : 260;
    setTimeout(() => {
      if(!$("#cover").classList.contains("ready")) finishIntro();
      setStage("hall");
      setTimeout(reset, 400);
    }, beat);
  }
  function reset(){
    value = 0; target = 0; head = 0; vel = 0; spd = 0;
    entered = false; lastAmp = 0;
    root.classList.remove("done");
    readout(); paint(true); placeKnob();
  }

  /* 30 根杆：暗的是没走到的，亮的是走过的；
     推杆尖端附近按速度抬起一个"浪"，越快越宽越高，朝后更宽——像被推开的水。 */
  function paint(force){
    const p = soft ? target : head;
    const h = p / 100 * (BARS - 1);
    const v = soft ? 0 : spd;
    amp = smoothstep(clamp01(Math.abs(v) * SENS / FULL_SPEED));
    const dir = v < 0 ? -1 : 1;
    const r = MIN_REACH + (REACH - MIN_REACH) * amp;
    const behind = r * (1 + SKEW), ahead = r * (1 - 0.5 * SKEW);
    const lit = Math.round(h);
    const still = !force && amp < FLAT && lastAmp < FLAT;
    for(let i = 0; i < BARS; i++){
      const el = bars[i];
      const on = i <= lit;
      if(el._on !== on){ el._on = on; el.classList.toggle("on", on); }
      if(still) continue;
      const d = i - h;
      const R = d * dir < 0 ? behind : ahead;
      const lift = Math.abs(d) < R ? amp * Math.pow(Math.cos(Math.PI * d / (2 * R)), 2) : 0;
      el.style.transform = "scaleY(" + (REST + lift * (1 - REST)).toFixed(4) + ")";
      crests[i].style.opacity = lift.toFixed(3);
    }
    lastAmp = amp;
  }
  function placeKnob(){
    const w = track.clientWidth;
    if(!w) return;
    const p = (soft ? target : head) / 100;
    knob.style.transform = "translate3d(" + (p * (w - KNOB)).toFixed(2) + "px,-50%,0)";
  }
  function frame(ts){
    raf = 0;
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 1 / 60;
    lastTs = ts;
    vel += (K * (target - head) - C * vel) * dt;
    head += vel * dt;
    if(Math.abs(target - head) < 0.02 && Math.abs(vel) < 0.6){ head = target; vel = 0; }
    spd += (vel - spd) * (1 - Math.exp(-dt / (SMOOTH / 1000)));
    paint(false);
    placeKnob();
    if(head === target && vel === 0 && Math.abs(spd) < 2){
      spd = 0; lastTs = 0;
      paint(true);              // 收尾：把杆子压回静止高度
    }
    else go();
  }

  track.addEventListener("pointerdown", e => {
    if(pid !== null) return;
    if(e.pointerType === "mouse" && e.button !== 0) return;
    pid = e.pointerId; dragging = true;
    root.classList.remove("kbd");
    try{ track.setPointerCapture(pid); }catch(err){}
    commit(valueFromX(e.clientX));
  });
  track.addEventListener("pointermove", e => {
    if(e.pointerId !== pid) return;
    commit(valueFromX(e.clientX));
  });
  const endDrag = e => {
    if(e.pointerId !== pid) return;
    try{ track.releasePointerCapture(pid); }catch(err){}
    pid = null; dragging = false;
    disarmHold();
    if(value >= MAX) enterHall();
  };
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);
  track.addEventListener("lostpointercapture", endDrag);
  track.addEventListener("keydown", e => {
    root.classList.add("kbd");
    const jumps = {
      ArrowRight: value + STEP, ArrowUp: value + STEP,
      ArrowLeft: value - STEP, ArrowDown: value - STEP,
      PageUp: value + 10, PageDown: value - 10, Home: MIN, End: MAX
    };
    if(!(e.key in jumps)) return;
    e.preventDefault();
    commit(jumps[e.key]);
    head = target; vel = 0; spd = 0;      // 键盘直接落位，不留惯性
    paint(true); placeKnob();
    if(value >= MAX) enterHall();
  });
  /* 推杆上的点击别冒到封面去（封面有"点哪儿都跳过建档"的兜底） */
  root.addEventListener("click", e => e.stopPropagation());
  addEventListener("resize", placeKnob);

  readout(); paint(true);
  requestAnimationFrame(placeKnob);
  return { reset };
}

/* ---------------- 场景切换（封面 / 展厅） ---------------- */
function fitCover(){
  const cover = $("#cover"); if(!cover) return;
  cover.classList.remove("tight", "tight2");
  const ci = $(".cover-in");
  if(!ci) return;
  /* 按真实剩余空间分配上下留白（下方留 40%），让各尺寸下都居得自然 */
  ci.style.marginBottom = "";
  if(cover.clientHeight >= 700){
    const free = cover.clientHeight - ci.offsetHeight;
    if(free > 40) ci.style.marginBottom = Math.round(Math.min(free * 0.4, 170)) + "px";
  }
  const over = () => ci.scrollHeight + (parseFloat(ci.style.marginBottom) || 0) > cover.clientHeight - 4;
  if(over()){
    ci.style.marginBottom = "";
    if(over()){
      cover.classList.add("tight");
      void ci.offsetHeight;
      if(over()) cover.classList.add("tight2");
    }
  }
}

/* 锁滚动必须同时落在 html 上——视口的滚动根是 documentElement，只锁 body 挡不住 */
function lockScroll(on){
  document.documentElement.classList.toggle("locked", on);
  document.body.classList.toggle("locked", on);
}

let ring = null;
let ptTitle = null;
function setStage(which){
  const cover = $("#cover"), hall = $("#hall");
  const coverUp = which === "cover";
  cover.classList.toggle("gone", !coverUp);
  hall.classList.toggle("on", !coverUp);
  if(coverUp){ cover.removeAttribute("inert"); hall.setAttribute("inert", ""); }
  else { cover.setAttribute("inert", ""); hall.removeAttribute("inert"); }
  cover.setAttribute("aria-hidden", coverUp ? "false" : "true");
  hall.setAttribute("aria-hidden", coverUp ? "true" : "false");
  /* 封面和展厅都是固定的一屏，两边都不允许页面滚动 */
  lockScroll(true);
  document.documentElement.classList.toggle("stage-cover", coverUp);
  activeMat = coverUp ? matCover : matGlobal;
  if(activeMat) activeMat.build();
  if(ring) ring.setLive(!coverUp);
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* ---------------- 启动 ---------------- */
document.addEventListener("DOMContentLoaded", () => {
  ring = buildRing();
  initBackground();
  initHeroPrint();
  /* 底栏是 fixed 的，把它的高度交给 CSS，展厅那一屏才不会被压住 */
  const setSb = () => document.documentElement.style.setProperty("--sbh", ($("#sysbar").offsetHeight || 32) + "px");
  setSb();
  setStage("cover");
  fitCover();
  let frt;
  addEventListener("resize", () => {
    clearTimeout(frt);
    frt = setTimeout(() => { setSb(); fitCover(); }, 160);
  });

  if(reduceMotion) finishIntro(); else runIntro();
  if(!reduceMotion) splitCoverText();
  ptTitle = initParticleTitle();
  $("#skipBtn").addEventListener("click", finishIntro);
  $("#cover").addEventListener("click", () => { if(!$("#cover").classList.contains("ready")) finishIntro(); });

  initWakeSlider();
  $("#backCover").addEventListener("click", () => setStage("cover"));
  $("#vClose").addEventListener("click", close);
  $("#vPrev").addEventListener("click", () => step(-1));
  $("#vNext").addEventListener("click", () => step(1));
  document.addEventListener("keydown", e => {
    if(!current) return;
    if(e.key === "Escape") close();
    if(e.key === "ArrowLeft") step(-1);
    if(e.key === "ArrowRight") step(1);
  });
  window.addEventListener("popstate", () => {
    const id = location.hash.replace("#", "");
    if(EXHIBITS.some(e => e.id === id)) open(id); else if(current) close();
  });
  const id = location.hash.replace("#", "");
  if(EXHIBITS.some(e => e.id === id)){ setStage("hall"); open(id); }
});
</script>
